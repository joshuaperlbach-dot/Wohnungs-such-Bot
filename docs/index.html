<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Wohnungen</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --ink: #1c1d21; --muted: #6b6e76; --line: #e3e1da;
    --star: #c98a00; --chip: #eeece6;
    --sent: #1f8f4e; --sent-ink: #ffffff;
    --idle: #d9d8d3; --idle-ink: #3b3d44;
    --late: #dcc3be; --late-ink: #5a2f29;
    --viz: #2a78d6; --viz-track: #e6e4dd;
    --s1: #86b6ef; --s2: #5598e7; --s3: #2a78d6; --s4: #1c5cab; --s5: #104281;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1e2127; --ink: #eceae4; --muted: #9a9da6; --line: #2d3139;
      --star: #f0b429; --chip: #2a2e36;
      --sent: #2aa55d; --sent-ink: #06170d;
      --idle: #3a3e47; --idle-ink: #d5d6da;
      --late: #5b3f3c; --late-ink: #f1d3ce;
      --viz: #3987e5; --viz-track: #2d3139;
      --s1: #184f95; --s2: #256abf; --s3: #3987e5; --s4: #6da7ec; --s5: #b7d3f6;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 16px 10px;
           padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; }
  #status { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #status.stale { color: var(--late-ink); background: var(--late); display: inline-block;
                  padding: 2px 8px; border-radius: 8px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { flex: 1; }
  #run { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 14px; font-size: 14px;
         font-weight: 600; white-space: nowrap; }
  #run:disabled { background: var(--chip); color: var(--muted); }
  #runs { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #runs.never { color: var(--late-ink); }
  #token { width: min(92vw, 420px); height: fit-content; border-radius: 16px; padding: 18px; margin: auto;
           border: 1px solid var(--line); }
  #token h2 { margin: 0 0 8px; font-size: 18px; }
  #token p { color: var(--muted); font-size: 14px; margin: 6px 0; }
  #token input { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--line); margin: 10px 0;
                 background: var(--card); color: var(--ink); font: inherit; }
  #token .row { display: flex; gap: 8px; }
  #token .row button { flex: 1; padding: 11px; border-radius: 10px; background: var(--chip); font-weight: 600; }
  #token .row .ok { background: var(--ink); color: var(--bg); }
  #token a { color: inherit; }
  .bar { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .seg { background: var(--chip); border-radius: 999px; padding: 7px 13px; font-size: 14px; }
  .seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .gap { flex: 1; }
  .tabs { margin-top: 8px; }
  .tabs .seg { font-weight: 600; }
  .section { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 2px 8px; }
  .badge { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 650;
           margin-left: 8px; letter-spacing: 0; vertical-align: 1px; background: var(--sent); color: var(--sent-ink); }
  .badge.soon { background: var(--star); color: #1c1300; }
  main { padding: 12px 16px 40px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 14px; margin-bottom: 12px; overflow: hidden;
          border: 1px solid var(--line); }
  .card .tap { display: flex; gap: 12px; padding: 12px; width: 100%; text-align: left; background: none; }
  /* Alle Fotos direkt in der Liste: zum Wischen */
  .strip { display: flex; gap: 3px; overflow-x: auto; scroll-snap-type: x mandatory; height: 200px;
           background: var(--chip); scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip img { height: 100%; width: 82%; flex: none; object-fit: cover; scroll-snap-align: start; display: block; }
  .strip.one img { width: 100%; }
  .strip .none { margin: auto; color: var(--muted); font-size: 13px; }
  .count { position: absolute; right: 8px; top: 8px; background: rgba(0, 0, 0, .55); color: #fff;
           font-size: 12px; padding: 2px 7px; border-radius: 10px; pointer-events: none; }
  .pics { position: relative; }
  .bez { color: var(--ink); font-weight: 600; }
  .info { min-width: 0; flex: 1; }
  .stars { color: var(--star); letter-spacing: 1px; font-size: 15px; }
  .stars small { color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .main-line { font-weight: 650; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req { display: block; width: calc(100% - 24px); margin: 0 12px 12px; padding: 11px 12px; border-radius: 10px;
         font-weight: 600; font-size: 15px; background: var(--idle); color: var(--idle-ink); }
  .req.late { background: var(--late); color: var(--late-ink); }
  a.req { text-align: center; text-decoration: none; box-sizing: border-box; }
  .req.go { background: var(--ink); color: var(--bg); }
  .req.ask { background: var(--star); color: #1c1300; }
  .req.sent { background: var(--sent); color: var(--sent-ink); }
  .req.invite { background: var(--star); color: #1c1300; }
  .req.declined { background: var(--idle); color: var(--muted); }
  .req small { font-weight: 400; opacity: .85; margin-left: 6px; }
  .gone { color: var(--late-ink); }
  .link.off { background: var(--chip); color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 48px 12px; }

  dialog { border: 0; padding: 0; margin: 0; width: 100%; max-width: 100%; height: 100%; max-height: 100%;
           background: var(--bg); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  .sheet { max-width: 720px; margin: 0 auto; padding-bottom: 110px; }
  .close { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 3; width: 40px;
           height: 40px; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; font-size: 20px; }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: var(--chip);
             min-height: 120px; }
  .gallery img { width: 100%; flex: none; scroll-snap-align: center; aspect-ratio: 4 / 3; object-fit: cover;
                 display: block; }
  .gallery.many img { width: 88%; margin-right: 4px; }
  .body { padding: 14px 16px; }
  .body h2 { font-size: 19px; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .chip { background: var(--chip); border-radius: 8px; padding: 5px 9px; font-size: 14px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:last-child { text-align: right; }
  .part { display: grid; grid-template-columns: 108px 1fr 54px; gap: 8px; align-items: center;
          font-size: 14px; margin: 5px 0; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .fill { height: 100%; background: var(--star); border-radius: 4px; }
  .part span:last-child { text-align: right; color: var(--muted); }
  .text { white-space: pre-line; overflow-wrap: anywhere; }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
          padding: 10px 16px max(10px, env(safe-area-inset-bottom)); }
  .foot .in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  .foot .req { margin: 0; width: auto; flex: 1; }
  /* Fotos in voller Größe zum Durchwischen */
  dialog.viewer { background: #000; color: #fff; }
  .viewer .frames { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .viewer .frames::-webkit-scrollbar { display: none; }
  .viewer .frames img { flex: none; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
  .viewer .pos { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); text-align: center;
                 font-size: 14px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .strip img, .gallery img { cursor: zoom-in; }
  /* Karte in der Anzeige */
  #map { height: 280px; border-radius: 12px; background: var(--chip); z-index: 0; }
  .dist { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .places-btn { background: var(--chip); border-radius: 8px; padding: 6px 10px; font-size: 14px; margin-top: 8px; }
  /* Grundriss in der Anzeige: ganz zeigen, weißer Grund (oft GIF/PNG mit Transparenz) */
  .plans img { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: #fff;
               border-radius: 10px; margin-bottom: 8px; cursor: zoom-in; }
  .badge.plan { background: var(--chip); color: var(--ink); }
  /* Statistik */
  .stats { display: grid; gap: 12px; }
  .hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .big { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; min-width: 0; }
  .big b { display: block; font-size: 32px; line-height: 1.05; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .big span { display: block; font-weight: 600; font-size: 13.5px; margin-top: 2px; }
  .big small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 4px; line-height: 1.3; }
  .viz { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; }
  .viz h4 { margin: 0; font-size: 16.5px; line-height: 1.3; font-weight: 700; }
  .viz .how, .stats > .how { color: var(--muted); font-size: 12.5px; line-height: 1.4; margin: 4px 0 10px; }
  .facts { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .facts li { position: relative; padding-left: 16px; font-size: 14.5px; line-height: 1.4; }
  .facts li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--s4); }
  .stage { padding: 6px 0; border-radius: 8px; }
  .stage.hot { background: var(--chip); }
  .slab { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .slab b { font-variant-numeric: tabular-nums; }
  .sbar { height: 14px; background: var(--viz-track); border-radius: 4px; overflow: hidden; }
  .sbar i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
  .conv { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .statmap { height: 300px; border-radius: 10px; background: var(--chip); z-index: 0; }
  .leaflet-tooltip.bubble-label { background: transparent; border: 0; box-shadow: none; color: #fff; font: 700 12px system-ui, sans-serif;
                  text-shadow: 0 0 3px rgba(0,0,0,.6); padding: 0; }
  .bubble-label::before, .place-label::before { display: none; }
  .leaflet-tooltip.place-label { background: var(--card); color: var(--ink); border: 0; font: 600 11px system-ui, sans-serif; padding: 1px 5px; }
  .legend { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .legend span { margin-right: 4px; }
  .legend .ringkey { border-radius: 50%; border: 1.6px solid var(--ink); width: 9px; height: 9px; margin-left: 6px; }
  .plot { width: 100%; height: auto; display: block; overflow: visible; }
  .plot .grid { stroke: var(--line); stroke-width: 1; }
  .plot .axis { stroke: var(--muted); stroke-width: 1; opacity: .6; }
  .plot .ref { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
  .plot .tick { fill: var(--muted); font: 10.5px system-ui, sans-serif; }
  .plot .ref-t { font-size: 10px; }
  .plot .val { fill: var(--ink); font: 600 10.5px system-ui, sans-serif; }
  .plot .pt.hot circle:last-child { stroke: var(--ink); stroke-width: 2.5; }
  .plot .col.hot path, .plot .col.hot rect:not(:first-child) { opacity: .8; }
  .heat { display: grid; grid-template-columns: 26px repeat(8, 1fr); gap: 3px; font-size: 11px; color: var(--muted); }
  .heat .hx { text-align: left; }
  .heat .hy { align-self: center; }
  .heat .cell { aspect-ratio: 1.6; border-radius: 4px; }
  .heat .cell.hot { outline: 2px solid var(--ink); outline-offset: -1px; }
  .crow { display: grid; grid-template-columns: 70px 1fr 56px 56px 34px; gap: 8px; align-items: center; padding: 7px 4px;
          border-bottom: 1px solid var(--line); font-size: 13.5px; border-radius: 6px; }
  .crow.hot { background: var(--chip); }
  .chead, .cscale { color: var(--muted); font-size: 11.5px; border-bottom: 0; padding-bottom: 2px; }
  .cscale { padding-top: 2px; }
  .cname { font-weight: 600; font-size: 13px; line-height: 1.15; overflow-wrap: anywhere; }
  .nbar { display: flex; align-items: center; gap: 5px; height: 16px; }
  .nbar i { display: block; height: 100%; background: var(--s4); border-radius: 0 4px 4px 0; min-width: 2px; flex: none; }
  .nbar em { font: 600 11.5px system-ui, sans-serif; font-style: normal; color: var(--ink); font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 16px; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--viz-track); border-radius: 2px; }
  .track i { position: absolute; top: 3px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--s5);
             box-shadow: 0 0 0 2px var(--card); }
  .rate { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .tip { position: fixed; z-index: 50; display: none; max-width: 260px; background: var(--ink); color: var(--bg); border-radius: 8px;
         padding: 7px 10px; font-size: 12.5px; line-height: 1.35; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .tip b { display: block; font-size: 14px; }
  .tip span { display: block; opacity: .85; }
  /* Mails zur Wohnung (verschlüsselt gespeichert, Text erst nach Antippen) */
  .mail { border-bottom: 1px solid var(--line); }
  .mail > button { width: 100%; text-align: left; background: none; padding: 9px 0; display: flex; gap: 8px;
                   align-items: baseline; font-size: 15px; }
  .mail .kind { font-weight: 650; }
  .mail .kind.absage { color: var(--muted); }
  .mail .kind.einladung, .mail .kind.selbstauskunft { color: var(--star); }
  .mail .meta { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  .mail .open { white-space: pre-line; overflow-wrap: anywhere; font-size: 14px; background: var(--chip);
                border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; }
  .mail .open b { display: block; margin-bottom: 6px; }
  .leaflet-tooltip { font: 600 12px system-ui, sans-serif; padding: 2px 6px; }
  .link { flex: 1; text-align: center; padding: 11px 12px; border-radius: 10px; background: var(--ink);
          color: var(--bg); font-weight: 600; text-decoration: none; font-size: 15px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Wohnungen <span id="count"></span></h1>
    <button id="run">Bot starten</button>
  </div>
  <div id="status">lädt …</div>
  <div id="runs"></div>
  <div class="bar tabs">
    <button class="seg" data-view="offers">Angebote</button>
    <button class="seg" data-view="mine">Meine Anfragen</button>
    <button class="seg" data-view="stats">Statistik</button>
  </div>
  <div class="bar" id="filters">
    <button class="seg" data-min="0">Alle</button>
    <button class="seg" data-min="3">★3+</button>
    <button class="seg" data-min="4">★4+</button>
    <span class="gap"></span>
    <button class="seg" data-sort="best">Beste</button>
    <button class="seg" data-sort="new">Neueste</button>
  </div>
</header>
<main id="list"></main>
<dialog id="detail"></dialog>
<dialog id="viewer" class="viewer"></dialog>
<dialog id="token">
  <h2>Bot von hier starten</h2>
  <p>Dafür braucht die App einmalig einen GitHub-Schlüssel (Token), der nur diesen Bot starten darf.
     Er bleibt auf diesem Gerät gespeichert.</p>
  <p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Token bei GitHub erstellen</a>:
     nur das Repository „Wohnungs-such-Bot“, Berechtigung „Actions: Read and write“.</p>
  <input id="token-input" type="password" autocomplete="off" placeholder="github_pat_…">
  <p id="token-msg"></p>
  <div class="row">
    <button id="token-cancel">Abbrechen</button>
    <button id="token-save" class="ok">Speichern und starten</button>
  </div>
</dialog>

<script>
"use strict";
const HOUR = 3600e3;
const LATE_AFTER = 2 * HOUR;          // rötlich: so lange online und keine Anfrage
const STALE_AFTER = 45 * 60e3;        // Warnung: Bot hat so lange nichts aktualisiert
const DISPATCH = "https://api.github.com/repos/joshuaperlbach-dot/Wohnungs-such-Bot/actions/workflows/wbm.yml/dispatches";
let offers = {}, updated = null, lastAuto = null, lastManual = null, startedAt = 0;
let minStars = 0, openKey = null;
// Tab: alle Angebote oder nur die eigenen Anfragen (merkt sich das Gerät)
let view = (() => { try { const v = localStorage.getItem("view"); return v === "mine" || v === "stats" ? v : "offers"; } catch (e) { return "offers"; } })();
// Sortierung merkt sich das Gerät
let newestFirst = (() => { try { return localStorage.getItem("sort") === "new"; } catch (e) { return false; } })();

// Eigene Markierungen ("von Hand angefragt") bleiben nur auf diesem Gerät gespeichert.
function loadMarks() {
  try { return JSON.parse(localStorage.getItem("marks") || "{}"); } catch (e) { return {}; }
}
function saveMarks(m) {
  try { localStorage.setItem("marks", JSON.stringify(m)); } catch (e) { /* privater Modus */ }
}
let marks = loadMarks();
// "Nicht weiter verfolgen" (z.B. nach der Besichtigung): nur auf diesem Gerät
let dropped = (() => { try { return JSON.parse(localStorage.getItem("dropped") || "{}"); } catch (e) { return {}; } })();
function toggleDropped(key) {
  if (dropped[key]) delete dropped[key]; else dropped[key] = new Date().toISOString();
  try { localStorage.setItem("dropped", JSON.stringify(dropped)); } catch (e) {}
  render();
}
// Angebote, deren Anfrage-Seite von hier geöffnet wurde (danach fragt der Knopf, ob es geklappt hat)
let opened = (() => { try { return JSON.parse(localStorage.getItem("opened") || "{}"); } catch (e) { return {}; } })();
function saveOpened() { try { localStorage.setItem("opened", JSON.stringify(opened)); } catch (e) {} }
// Link springt, wo möglich, direkt zum Anfrage-Formular der Gesellschaft (wie in der Push-Meldung)
const FORM_ANCHOR = { degewo: "#accordion-nl-rent-details" };
const formUrl = o => { const u = safeUrl(o.url); return u && !u.includes("#") ? u + (FORM_ANCHOR[o.company] || "") : u; };

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const safeUrl = u => (typeof u === "string" && /^https:\/\//.test(u)) ? u : null;
// Bilder: Adresse der Gesellschaft oder vom Bot gesicherte Kopie (docs/img/...)
const imgUrl = u => safeUrl(u) || ((typeof u === "string" && /^img\/[\w-]+\/[\w.-]+$/.test(u)) ? u : null);
const num = (v, digits = 0) => v == null ? "?" :
  Number(v).toLocaleString("de-DE", { minimumFractionDigits: digits, maximumFractionDigits: digits });
const rooms = v => v == null ? "?" : String(v).replace(".", ",");
function ago(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  if (!isFinite(ms)) return "";
  if (ms < 90e3) return "gerade eben";
  if (ms < HOUR) return `vor ${Math.round(ms / 60e3)} Min`;
  if (ms < 36 * HOUR) return `vor ${Math.round(ms / HOUR)} Std`;
  return `vor ${Math.round(ms / (24 * HOUR))} Tagen`;
}
const COMPANY = { wbm: "WBM", degewo: "degewo", howoge: "HOWOGE", gewobag: "Gewobag", gesobau: "GESOBAU",
                  stadtundland: "Stadt und Land", berlinovo: "Berlinovo" };

function state(key, o) {
  if (dropped[key]) return { cls: "declined", label: "Nicht weiter verfolgt", note: "deine Entscheidung", locked: true };
  if (isQuiet(o)) return { cls: "declined", label: "Wohl nichts geworden", note: quietReason(o), locked: true };
  // Antwort der Gesellschaft, vom Bot aus der Mail gelesen
  if (o.termin && o.reply !== "absage") {
    const v = viewing(o);
    if (v && !v.cls) return { cls: "sent", label: "Besichtigt", note: "warte auf Antwort", locked: true };
    if (v) return { cls: "invite", label: "Termin gebucht", note: v.text.replace("Besichtigung ", ""), locked: true };
  }
  if (o.reply === "einladung") return { cls: "invite", label: "Einladung zur Besichtigung", note: "schau in deine Mails", locked: true };
  if (o.reply === "selbstauskunft") return { cls: "invite", label: "Selbstauskunft ausfüllen!", note: "Link in der WBM-Mail, 24 Std", locked: true };
  if (o.reply === "absage") return { cls: "declined", label: "Absage", note: "Anfrage war raus", locked: true };
  if (o.reply === "antwort") return { cls: "sent", label: "Antwort da", note: "schau in deine Mails", locked: true };
  // degewo: nach der Anfrage noch ein zweites Formular; das füllt der Bot selbst aus
  if (o.confirm === "formular_gesendet" && !o.reply) {
    return { cls: "sent", label: "Angefragt", note: "zweites Formular vom Bot ausgefüllt", locked: true };
  }
  if (o.confirm === "formular" && !o.reply) {
    return { cls: "ask", label: "Zweites Formular offen", note: "Bot füllt aus, sonst kommt eine Push-Meldung", locked: true };
  }
  if (o.confirm === "abgelaufen") return { cls: "declined", label: "Anfrage nicht bestätigt", note: "Link aus der Mail abgelaufen", locked: true };
  if (o.requested === "unklar" && o.confirm === "offen") {
    return { cls: "sent", label: "Anfrage raus", note: "Bestätigung per Mail offen", locked: true };
  }
  if (o.requested === "gesendet" || o.requested === "unklar") {
    return { cls: "sent", label: "Angefragt", note: o.via === "mail" ? "Eingang per Mail bestätigt"
             : o.requested === "unklar" ? "vom Bot, ohne Bestätigung" : "vom Bot",
             locked: true };
  }
  if (marks[key]) return { cls: "sent", label: "✓ Von dir angefragt", note: "tippen zum Zurücknehmen", toggle: true };
  // Nach dem Öffnen eine Stunde lang nachfragen; danach (z.B. doch nicht angefragt) wieder normal
  if (opened[key] && !o.gone && Date.now() - new Date(opened[key]).getTime() < HOUR) {
    return { cls: "ask", label: "Angefragt?", note: "tippen = ja", toggle: true };
  }
  if (o.gone) return { cls: "", label: "Als angefragt markieren", note: "", toggle: true };
  const url = formUrl(o);
  const online = Date.now() - new Date(o.online_since).getTime();
  const late = online > LATE_AFTER;
  const note = late ? `online ${ago(o.online_since).replace("vor ", "seit ")}` : "öffnet das Formular";
  return { cls: late ? "late" : "go", label: url ? "Jetzt anfragen ↗" : "Als angefragt markieren", note, url };
}

function reqButton(key, o) {
  const s = state(key, o);
  // Noch nicht angefragt: der Knopf öffnet direkt das Formular der Gesellschaft
  const b = s.url ? el("a", "req " + s.cls, s.label) : el("button", "req " + s.cls, s.label);
  if (s.note) b.append(el("small", null, s.note));
  if (s.url) {
    b.href = s.url; b.target = "_blank"; b.rel = "noopener noreferrer";
    b.addEventListener("click", ev => {
      ev.stopPropagation();
      opened[key] = new Date().toISOString();
      saveOpened();
      setTimeout(render, 500);  // zurück in der App: Knopf fragt dann, ob es geklappt hat
    });
    return b;
  }
  b.addEventListener("click", ev => {
    ev.stopPropagation();
    if (s.locked) return;
    if (marks[key]) { delete marks[key]; delete opened[key]; } else marks[key] = { at: new Date().toISOString(), offer: o };
    saveMarks(marks); saveOpened();
    render();
  });
  return b;
}

function all() {
  // Von Hand angefragte Angebote bleiben sichtbar, auch wenn der Bot sie schon aussortiert hat.
  const merged = {};
  for (const [k, m] of Object.entries(marks)) if (m && m.offer) merged[k] = m.offer;
  const out = { ...merged, ...offers };
  // Von Hand markiert: der Zeitpunkt der Markierung gilt als Anfragezeit (für "Wohl nichts geworden")
  for (const [k, m] of Object.entries(marks)) {
    if (out[k] && m && m.at && !out[k].requested_at) out[k] = { ...out[k], requested_at: m.at };
  }
  return Object.entries(out);
}

function render() {
  const items = all().filter(([, o]) => (o.stars || 0) >= minStars);
  items.sort(([, a], [, b]) => newestFirst
    ? new Date(b.online_since) - new Date(a.online_since)
    : (b.points ?? b.stars * 20) - (a.points ?? a.stars * 20) || new Date(b.online_since) - new Date(a.online_since));
  document.getElementById("count").textContent = `(${items.length})`;
  document.querySelectorAll("[data-min]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.min === minStars)));
  document.querySelectorAll("[data-sort]").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.sort === "new") === newestFirst)));
  const status = document.getElementById("status");
  if (updated) {
    const stale = Date.now() - new Date(updated).getTime() > STALE_AFTER;
    status.textContent = stale ? `Bot zuletzt gelaufen ${ago(updated)} – läuft er noch?` : `aktualisiert ${ago(updated)}`;
    status.className = stale ? "stale" : "";
  }
  const runs = document.getElementById("runs");
  if (updated) {
    runs.textContent = (lastAuto ? `Automatisch zuletzt ${ago(lastAuto)}` : "Noch nie automatisch gelaufen")
      + (lastManual ? ` · von Hand zuletzt ${ago(lastManual)}` : "");
    runs.className = lastAuto ? "" : "never";
  }
  const run = document.getElementById("run");
  const waiting = Date.now() - startedAt < 150e3;   // ein Lauf dauert etwa 2 Minuten
  run.disabled = waiting;
  run.textContent = waiting ? "läuft …" : "Bot starten";
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  document.getElementById("filters").style.display = view === "offers" ? "" : "none";
  const list = document.getElementById("list");
  list.replaceChildren();
  if (view === "mine") {
    renderMine(list);
  } else if (view === "stats") {
    renderStats(list);
  } else {
    if (!items.length) list.append(el("div", "empty", updated ? "Gerade keine passenden Angebote." : "lädt …"));
    for (const [key, o] of items) list.append(makeCard(key, o));
  }
  if (openKey) drawDetail();
}

// ---- Tab "Meine Anfragen": oben was läuft, darunter die Absagen; Besichtigungen markiert
function isMine(key, o) {
  return o.requested === "gesendet" || o.requested === "unklar" || !!marks[key] || !!o.reply;
}
function isLost(o) { return o.reply === "absage" || o.confirm === "abgelaufen"; }
// Wohl nichts geworden: Die HOWOGE lädt meist nach 1–3 Tagen ein, sonst nie; eine Einladung ohne gebuchten
// Termin verfällt nach 24 Stunden; sonst (WBM-Los, degewo, Gewobag ...) nach zwei Wochen ohne Nachricht.
function quietReason(o) {
  if (isLost(o)) return null;
  const t = v => new Date(v || 0).getTime() || 0;
  const age = Date.now() - Math.max(t(o.requested_at), t(o.reply_at), t(o.termin));
  if (!Math.max(t(o.requested_at), t(o.reply_at), t(o.termin))) return null;
  if (o.reply === "einladung" && !o.termin && age > 2 * 24 * HOUR) return "Einladung verfallen";
  if (o.company === "howoge" && !o.reply && !o.termin && age > 7 * 24 * HOUR) return "nicht ausgelost";
  if (age > 14 * 24 * HOUR) return "seit über 2 Wochen nichts";
  return null;
}
const isQuiet = o => !!quietReason(o);
function viewing(o) {   // Besichtigungstermin (vom Bot aus der Terminbestätigung gelesen)
  const t = o.termin ? new Date(o.termin) : null;
  if (!t || !isFinite(t)) return null;
  const when = t.toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  return Date.now() > t.getTime() + 30 * 60e3 ? { cls: "", text: "✓ Besichtigt" } : { cls: "soon", text: `Besichtigung ${when}` };
}
function renderMine(list) {
  const mine = all().filter(([k, o]) => isMine(k, o));
  const when = o => new Date(o.reply_at || o.requested_at || o.online_since).getTime() || 0;
  const gone = mine.filter(([k]) => dropped[k]);
  const live = mine.filter(([k]) => !dropped[k]);
  const open = live.filter(([, o]) => !isLost(o) && !isQuiet(o)).sort(([, a], [, b]) => when(b) - when(a));
  const quiet = live.filter(([, o]) => isQuiet(o)).sort(([, a], [, b]) => when(b) - when(a));
  const lost = live.filter(([, o]) => isLost(o)).sort(([, a], [, b]) => when(b) - when(a));
  document.getElementById("count").textContent = `(${open.length})`;
  if (!mine.length) { list.append(el("div", "empty", updated ? "Noch keine Anfragen." : "lädt …")); return; }
  list.append(el("div", "section", `Läuft gerade (${open.length})`));
  if (!open.length) list.append(el("div", "empty", "Gerade läuft nichts."));
  for (const [key, o] of open) list.append(makeCard(key, o));
  if (quiet.length) {
    list.append(el("div", "section", `Wohl nichts geworden (${quiet.length})`));
    for (const [key, o] of quiet) list.append(makeCard(key, o));
  }
  if (lost.length) {
    list.append(el("div", "section", `Nicht bekommen (${lost.length})`));
    for (const [key, o] of lost) list.append(makeCard(key, o));
  }
  if (gone.length) {
    list.append(el("div", "section", `Nicht weiter verfolgt (${gone.length})`));
    for (const [key, o] of gone) list.append(makeCard(key, o));
  }
}

// Ein Tooltip für alle Grafiken: Hover, Fokus und Antippen (Handy)
let tipEl = null;
function showTip(ev, lines) {
  if (!tipEl) { tipEl = el("div", "tip"); document.body.append(tipEl); }
  tipEl.replaceChildren(el("b", null, lines[0]), ...lines.slice(1).map(t => el("span", null, t)));
  tipEl.style.display = "block";
  const r = tipEl.getBoundingClientRect();
  const x = Math.min(window.innerWidth - r.width - 8, Math.max(8, ev.clientX - r.width / 2));
  const y = ev.clientY - r.height - 14 < 8 ? ev.clientY + 18 : ev.clientY - r.height - 14;
  tipEl.style.left = `${x}px`; tipEl.style.top = `${y}px`;
}
function hideTip() { if (tipEl) tipEl.style.display = "none"; }
function hover(node, lines) {
  node.setAttribute("tabindex", "0");
  node.style.cursor = "pointer";
  const on = ev => { node.classList.add("hot"); showTip(ev.clientX != null ? ev : (() => { const b = node.getBoundingClientRect(); return { clientX: b.left + b.width / 2, clientY: b.top }; })(), lines()); };
  node.addEventListener("pointerenter", on);
  node.addEventListener("pointermove", on);
  node.addEventListener("click", ev => { ev.stopPropagation(); on(ev); });
  node.addEventListener("focus", on);
  for (const t of ["pointerleave", "blur"]) node.addEventListener(t, () => { node.classList.remove("hot"); hideTip(); });
}
document.addEventListener("click", hideTip);
window.addEventListener("scroll", hideTip, { passive: true });

function renderStats(list) {
  if (!history) { loadHistory(); list.append(el("div", "empty", "lädt Statistik …")); return; }
  const rows = { ...history };
  for (const [k, o] of all()) rows[k] = { ...(rows[k] || {}), ...o };

  const isAsked = it => it.requested === "gesendet" || it.requested === "unklar" || !!marks[it.k];
  const asked = items.filter(isAsked);
  const byHand = it => !!marks[it.k] || it.via === "mail";
  const nBot = asked.filter(it => !byHand(it)).length, nMe = asked.length - nBot;
  const replied = asked.filter(it => it.reply);
  const further = asked.filter(it => ["einladung", "selbstauskunft"].includes(it.reply) || it.termin);
  const invited = asked.filter(it => it.reply === "einladung" || it.termin);
  const visited = asked.filter(it => it.termin && Date.now() > new Date(it.termin).getTime() + 30 * 60e3);
  const declined = asked.filter(it => it.reply === "absage");
  const times = items.map(it => new Date(it.online_since)).filter(d => isFinite(d));
  const first = times.length ? new Date(Math.min(...times)) : new Date();

    [asked.length, "Anfragen", `${nBot} vom Bot · ${nMe} von dir`],

    qm: avg(a.filter(x => x.price && x.size).map(x => x.price / x.size)),

  const solid = compStats.filter(c => c.n >= 5);
  const best = [...solid].sort((a, b) => b.stars - a.stars)[0];
  const cheap = [...solid].sort((a, b) => a.qm - b.qm)[0];

  let peak = [0, 0, 0];

  const mapBox = el("div", "statmap");

  mapCard.append(legend);

  requestAnimationFrame(async () => {

    for (const x of bzStats) {

    map.fitBounds([[52.40, 13.20], [52.62, 13.62]]);
  });

  // ---------- Preis gegen Größe
  const pts = items.filter(it => it.price && it.size && it.size < 120 && it.price < 1400);
  const qmAll = avg(pts.map(it => it.price / it.size));
  const sc = card(`Im Schnitt ${num(qmAll, 1)} € warm pro m² – je weiter oben links, desto teurer`,
    "Jeder Punkt eine Wohnung: rechts = größer, oben = teurer. Farbe = Sterne (Legende unten), Ring = von dir/dem Bot angefragt. Linien: 12, 15 und 18 € pro m².");
  const W = 340, H = 240, ml = 34, mb = 22, mt = 8, mr = 8;
  const xs = pts.map(p => p.size), ys = pts.map(p => p.price);
  const x0 = 25, x1 = Math.max(75, Math.ceil(Math.max(...xs, 0) / 5) * 5), y0 = 300, y1 = Math.max(1000, Math.ceil(Math.max(...ys, 0) / 100) * 100);
  const X = v => ml + (W - ml - mr) * (v - x0) / (x1 - x0), Y = v => H - mb - (H - mb - mt) * (v - y0) / (y1 - y0);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "plot", role: "img", "aria-label": "Preis gegen Größe" });
  for (let v = 400; v <= y1; v += 200) {
    svgEl("line", { x1: ml, x2: W - mr, y1: Y(v), y2: Y(v), class: "grid" }, svg);
    svgEl("text", { x: ml - 4, y: Y(v) + 3, "text-anchor": "end", class: "tick" }, svg).textContent = `${v} €`;
  }
  for (let v = 30; v <= x1; v += 10) svgEl("text", { x: X(v), y: H - 6, "text-anchor": "middle", class: "tick" }, svg).textContent = `${v} m²`;
  svgEl("line", { x1: ml, x2: W - mr, y1: H - mb, y2: H - mb, class: "axis" }, svg);
  for (const q of [12, 15, 18]) {   // Linien gleicher €/m², bis an den Rand gekappt
    const xa = Math.max(x0, y0 / q), xb = Math.min(x1, y1 / q);
    if (xb <= xa) continue;
    svgEl("line", { x1: X(xa), y1: Y(q * xa), x2: X(xb), y2: Y(q * xb), class: "ref" }, svg);
    const t = svgEl("text", { x: X(xb) - 2, y: Y(q * xb) + (xb === x1 ? -4 : 10), "text-anchor": "end", class: "tick ref-t" }, svg);
    t.textContent = `${q} €/m²`;
  }
  for (const p of [...pts].sort((a, b) => (a.stars || 0) - (b.stars || 0))) {
    const g = svgEl("g", { class: "pt" }, svg);
    svgEl("circle", { cx: X(p.size), cy: Y(p.price), r: 12, fill: "transparent" }, g);   // große Trefferfläche
    svgEl("circle", { cx: X(p.size), cy: Y(p.price), r: isAsked(p) ? 4.5 : 3.6, fill: starColor(p.stars),

  const ring = el("i", "ringkey"); lg.append(ring, el("span", null, "angefragt"));
  sc.append(lg);
  wrap.append(sc);

  // ---------- Wann kommen neue Angebote?
  const hm = card(peak[0] ? `Neue Angebote kommen werktags vormittags – am meisten ${WD[peak[1]]} ${6 + 2 * peak[2]}–${8 + 2 * peak[2]} Uhr` : "Wann neue Angebote kommen",
    "Jedes Feld = Wochentag und Uhrzeit, je kräftiger die Farbe, desto mehr neue passende Angebote. Der Bot ist rund um die Uhr da, du musst also nicht aufpassen.");
  const maxC = Math.max(1, ...grid.flat());
  const table = el("div", "heat");
  table.append(el("span"));
  for (let j = 0; j < 8; j++) table.append(el("span", "hx", `${6 + 2 * j}`));
  grid.forEach((r, i) => {
    table.append(el("span", "hy", WD[i]));
    r.forEach((v, j) => {
      const c = el("span", "cell");
      const lvl = v ? Math.min(5, 1 + Math.floor(4.999 * v / maxC)) : 0;
      c.style.background = lvl ? `var(--s${lvl})` : "var(--viz-track)";
      hover(c, () => [`${v} Angebote`, `${["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"][i]}, ${6 + 2 * j}–${8 + 2 * j} Uhr`]);
      table.append(c);
    });
  });
  hm.append(table);
  wrap.append(hm);

  // ---------- Gesellschaften im Vergleich (Punkte auf gemeinsamen Achsen)
  const cc = card(best ? `${best.name}: wenige, aber die besten Wohnungen` : "Gesellschaften im Vergleich",
    "Balken = Zahl der Angebote. Punkte zeigen Ø Sterne (1–5) und Ø Warmmiete pro m² (10–20 €) auf derselben Skala für alle. Rechts: wie oft eine Anfrage eine Runde weiter kam.");

  head.append(el("span", null, ""), el("span", null, "Angebote"), el("span", null, "Ø Sterne"), el("span", null, "€/m²"), el("span", null, "weiter"));

  const nMax = Math.max(1, ...compStats.map(c => c.n));

    const dot = (v, lo, hi, cls) => { const t = el("div", "track " + cls); const d = el("i"); d.style.left = `${Math.max(0, Math.min(100, 100 * (v - lo) / (hi - lo)))}%`; if (v == null) d.style.display = "none"; t.append(d); return t; };
    r.append(el("span", "cname", c.name), nb, dot(c.stars, 1, 5, "st"), dot(c.qm, 10, 20, "qm"),

    hover(r, () => [c.name, `${c.n} Angebote · Ø ${c.stars ? c.stars.toFixed(1) : "?"} ★ · ${c.qm ? num(c.qm, 1) : "?"} €/m²`,
      c.asked ? `${c.asked} angefragt, ${c.further} eine Runde weiter` : "noch nie angefragt"]);
    cc.append(r);
  }
  const scale = el("div", "crow cscale");
  scale.append(el("span"), el("span"), el("span", null, "1 · · · 5"), el("span", null, "10 · · · 20"), el("span"));
  cc.append(scale);
  wrap.append(cc);

  // ---------- Wochen: passend vs. angefragt (gestapelt, gleiche Einheit)
  const weeks = new Map();
  const wkKey = d => { const t = new Date(d); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - (t.getDay() + 6) % 7); return t.getTime(); };
  for (let t = wkKey(first); t <= Date.now(); t += 7 * 864e5) weeks.set(wkKey(t), [0, 0]);
  for (const it of items) { const d = new Date(it.online_since); if (!isFinite(d)) continue; const w = weeks.get(wkKey(d)); if (w) w[isAsked(it) ? 1 : 0]++; }
  const wv = [...weeks.entries()];
  const lastFull = wv.length > 1 ? wv[wv.length - 2][1] : [0, 0];
  const wc = card(`Etwa ${Math.round(avg(wv.slice(0, -1).map(([, v]) => v[0] + v[1])) || 0)} passende Angebote pro Woche`,
    "Säule = passende Angebote der Woche, der abgesetzte Teil unten wurde angefragt. Die letzte Säule ist die laufende Woche.");
  const WW = 340, WH = 150, wb = 18, wt = 14;
  const wsvg = svgEl("svg", { viewBox: `0 0 ${WW} ${WH}`, class: "plot", role: "img", "aria-label": "Angebote pro Woche" });
  const wmax = Math.max(1, ...wv.map(([, v]) => v[0] + v[1]));
  const step = WW / Math.max(1, wv.length), bw = Math.min(30, step * 0.64);
  wv.forEach(([t, [rest, ak]], i) => {
    const x = i * step + (step - bw) / 2, hTot = (WH - wb - wt) * (rest + ak) / wmax, hAk = (WH - wb - wt) * ak / wmax;
    const g = svgEl("g", { class: "col" }, wsvg);
    svgEl("rect", { x: x - 3, y: wt - 6, width: bw + 6, height: WH - wb - wt + 6, fill: "transparent" }, g);
    if (hTot > 0) svgEl("path", { d: roundTop(x, WH - wb, bw, hTot), fill: "var(--s2)" }, g);
    if (hAk > 0) svgEl("rect", { x, y: WH - wb - hAk, width: bw, height: hAk, fill: "var(--s5)" }, g);
    if (hAk > 0 && hTot - hAk > 2) svgEl("line", { x1: x, x2: x + bw, y1: WH - wb - hAk, y2: WH - wb - hAk, stroke: "var(--card)", "stroke-width": 2 }, g);
    svgEl("text", { x: x + bw / 2, y: WH - wb - hTot - 4, "text-anchor": "middle", class: "val" }, g).textContent = rest + ak;
    const d = new Date(t);
    if (wv.length <= 8 || i % 2 === 0) svgEl("text", { x: x + bw / 2, y: WH - 5, "text-anchor": "middle", class: "tick" }, wsvg).textContent = `${d.getDate()}.${d.getMonth() + 1}.`;
    hover(g, () => [`${rest + ak} passende Angebote`, `Woche ab ${d.toLocaleDateString("de-DE")}`, `${ak} angefragt`]);
  });
  svgEl("line", { x1: 0, x2: WW, y1: WH - wb, y2: WH - wb, class: "axis" }, wsvg);
  wc.append(wsvg);
  const wl = el("div", "legend");
  const a1 = el("i"); a1.style.background = "var(--s2)"; const a2 = el("i"); a2.style.background = "var(--s5)";
  wl.append(a1, el("span", null, "passend"), a2, el("span", null, "angefragt"));
  wc.append(wl);
  wrap.append(wc);

  wrap.append(el("p", "how", "„Passend“ = hat die Filter des Bots bestanden (Größe, Preis, Bezirk, kein WBS). Von Hand markierte Anfragen zählen nur auf diesem Gerät mit. Alle Zahlen seit Start des Archivs am 13.10.2026."));
}
function roundTop(x, base, w, h) {   // Säule mit 4px runden Ecken oben
  const r = Math.min(4, h, w / 2), y = base - h;
  return `M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${base} Z`;
}

function makeCard(key, o) {
    const card = el("article", "card");
    const tap = el("button", "tap");
    const imgs = (o.images || []).map(imgUrl).filter(Boolean);
    const pics = el("div", "pics");
    const strip = el("div", "strip" + (imgs.length === 1 ? " one" : ""));
    for (const src of imgs) {
      const i = el("img");
      i.loading = "lazy"; i.alt = ""; i.referrerPolicy = "no-referrer"; i.src = src;
      i.addEventListener("error", () => i.remove());
      i.addEventListener("click", ev => { ev.stopPropagation(); viewFrom(strip, i); });
      strip.append(i);
    }
    if (!imgs.length) strip.append(el("span", "none", "kein Bild"));
    strip.addEventListener("click", () => openDetail(key));
    pics.append(strip);
    if (imgs.length > 1) pics.append(el("span", "count", `${imgs.length} Bilder`));
    const info = el("div", "info");
    const stars = el("div", "stars", "★".repeat(o.stars || 0) + "☆".repeat(5 - (o.stars || 0)));
    if (o.points != null) stars.append(el("small", null, `${o.points} Punkte`));
    const v = viewing(o);
    if (v) stars.append(el("span", "badge " + v.cls, v.text));
    if ((o.plans || []).length) stars.append(el("span", "badge plan", "Grundriss"));
    info.append(stars,
      el("div", "main-line", `${rooms(o.rooms)} Zi · ${num(o.size)} m² · ${num(o.price)} € warm`),
      place(o),
      o.gone ? el("div", "sub gone", `${COMPANY[o.company] || o.company || ""} · nicht mehr online`)
             : el("div", "sub", `${COMPANY[o.company] || o.company || ""} · online ${ago(o.online_since).replace("vor ", "seit ")}`));
    tap.append(info);
    tap.addEventListener("click", () => openDetail(key));
    card.append(pics, tap, reqButton(key, o));
    return card;
}

    const a = el("a", "link", "Zur Anzeige");

  inner.append(reqButton(openKey, o));

// ---- Mails: der Bot legt sie verschlüsselt ab (die Seite ist öffentlich). Den Schlüssel kennt nur dieses
// Gerät (einmal eingeben oder per Link #mailkey=...); er passt zum GitHub-Secret MAIL_VIEW_KEY.
const MAIL_KIND = { selbstauskunft: "Selbstauskunft nötig", absage: "Absage", einladung: "Einladung", eingang: "Eingangsbestätigung",
                    formular: "Formular nötig", antwort: "Antwort" };
const openMails = new Set(), mailCache = new Map();
let mailKeyPromise = null;
const getMailPass = () => { try { return localStorage.getItem("mailkey") || ""; } catch (e) { return ""; } };
function setMailPass(v) { mailKeyPromise = null; try { v ? localStorage.setItem("mailkey", v) : localStorage.removeItem("mailkey"); } catch (e) {} }
function mailKey(pass) {
  if (!mailKeyPromise) mailKeyPromise = crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
    .then(base => crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: new TextEncoder().encode("wohnungsbot-mails-v1"), iterations: 200000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]));
  return mailKeyPromise;
}
async function unseal(box) {
  if (mailCache.has(box)) return mailCache.get(box);
  const raw = Uint8Array.from(atob(box), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, await mailKey(getMailPass()), raw.slice(12));
  const v = JSON.parse(new TextDecoder().decode(plain));
  mailCache.set(box, v);
  return v;
}
function mailRow(m) {
  const wrap = el("div", "mail"), head = el("button");
  const when = m.at ? new Date(m.at).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "";
  head.append(el("span", "kind " + (m.kind || ""), MAIL_KIND[m.kind] || "Mail"), el("span", "meta", `${m.from || ""} · ${when}`));
  const box = el("div", "open");
  const show = async () => {
    if (!getMailPass()) {
      const k = prompt("Schlüssel für die Mails (einmal auf diesem Gerät eingeben):");
      if (!k) return;
      setMailPass(k.trim());
    }
    try {
      const v = await unseal(m.box);
      box.replaceChildren(el("b", null, v.subject || ""), document.createTextNode(v.text || ""));
    } catch (e) {
      setMailPass("");
      box.replaceChildren(document.createTextNode("Der Schlüssel passt nicht. Nochmal antippen und neu eingeben."));
    }
    if (!box.isConnected) wrap.append(box);
  };
  head.addEventListener("click", () => {
    if (openMails.has(m.id)) { openMails.delete(m.id); box.remove(); }
    else { openMails.add(m.id); show(); }
  });
  wrap.append(head);
  if (openMails.has(m.id)) show();
  return wrap;
}

// ---- Fotos in voller Größe: antippen, dann wischen
function viewFrom(container, img) {
  const srcs = [...container.querySelectorAll("img")].map(x => x.src);
  openViewer(srcs, Math.max(0, srcs.indexOf(img.src)));
}
function openViewer(srcs, start) {
  const dlg = document.getElementById("viewer");
  const frames = el("div", "frames"), pos = el("div", "pos");
  for (const src of srcs) {
    const i = el("img");
    i.alt = ""; i.referrerPolicy = "no-referrer"; i.src = src;
    frames.append(i);
  }
  const close = el("button", "close", "✕");
  close.setAttribute("aria-label", "Schließen");
  close.addEventListener("click", () => dlg.close());
  const update = () => { pos.textContent = `${Math.round(frames.scrollLeft / (frames.clientWidth || 1)) + 1} / ${srcs.length}`; };
  frames.addEventListener("scroll", update, { passive: true });
  dlg.replaceChildren(frames, close, pos);
  if (!dlg.open) { dlg.showModal(); history.pushState({ layer: "viewer" }, ""); }
  frames.scrollLeft = start * frames.clientWidth;
  update();
}

// ---- Karte: Wohnung und eigene Orte. Die eigenen Orte (z.B. Zuhause) stehen nur auf diesem Gerät,
// nie in der öffentlichen Seite. Einrichten über "Eigene Orte ändern" oder einen Link mit #orte=...
const LEAFLET = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
const DEFAULT_PLACES = [{ name: "Arbeit neu", q: "Engelbecken, Berlin", lat: 52.5049, lon: 13.4163, color: "#2f6fde" }];
const PLACE_COLORS = ["#2f6fde", "#7a4cc2", "#1f8f4e", "#c46a00"];
let leafletLoad = null;
function leaflet() {
  if (!leafletLoad) leafletLoad = new Promise(resolve => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = LEAFLET + "leaflet.css";
    document.head.append(css);
    const js = document.createElement("script");
    js.src = LEAFLET + "leaflet.js";
    js.onload = () => resolve(window.L || null);
    js.onerror = () => { leafletLoad = null; resolve(null); };
    document.head.append(js);
  });
  return leafletLoad;
}
let lastLookup = 0;
async function geocode(q) {
  const key = "geo:" + q;
  try { const c = localStorage.getItem(key); if (c) return JSON.parse(c); } catch (e) {}
  const wait = lastLookup + 1100 - Date.now();   // Nominatim: höchstens eine Anfrage pro Sekunde
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastLookup = Date.now();
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=" + encodeURIComponent(q));
    const d = await r.json();
    const v = d && d[0] ? [+d[0].lat, +d[0].lon] : null;
    if (v) try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
    return v;
  } catch (e) { return null; }
}
async function offerCoord(o) {
  if (Array.isArray(o.coord) && o.coord.length === 2 && o.coord.every(isFinite)) return o.coord.map(Number);
  return o.address ? geocode(o.address) : null;
}
function places() {
  try { const p = JSON.parse(localStorage.getItem("places") || "null"); if (Array.isArray(p)) return p; } catch (e) {}
  return DEFAULT_PLACES;
}
async function setPlaces(text) {   // "Zuhause: Straße 1, 10437; Arbeit: ..."
  const out = [];
  for (const part of text.split(";").map(x => x.trim()).filter(Boolean)) {
    const m = part.match(/^([^:]{1,30}):\s*(.+)$/);
    const name = (m ? m[1] : part).trim(), q = (m ? m[2] : part).trim();
    const c = await geocode(/berlin/i.test(q) ? q : q + ", Berlin");
    if (c) out.push({ name, q, lat: c[0], lon: c[1], color: PLACE_COLORS[out.length % PLACE_COLORS.length] });
  }
  try { localStorage.setItem("places", JSON.stringify(out)); } catch (e) {}
  return out;
}
async function editPlaces() {
  const now = places().map(p => `${p.name}: ${p.q || ""}`).join("; ");
  const t = prompt("Eigene Orte für die Karte (Name: Adresse), getrennt mit Semikolon:", now);
  if (t === null) return;
  await setPlaces(t);
  if (openKey) drawDetail();
}
function km(a, b) {
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
async function showMap(o, box, dist) {
  const where = await offerCoord(o);
  if (!box.isConnected) return;
  if (!where) { box.style.height = "auto"; box.replaceChildren(el("div", "dist", "Adresse nicht auf der Karte gefunden.")); return; }
  const L = await leaflet();
  if (!box.isConnected) return;
  if (!L) { box.style.height = "auto"; box.replaceChildren(el("div", "dist", "Karte konnte nicht geladen werden.")); return; }
  const map = L.map(box, { scrollWheelZoom: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
              { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  const label = (m, text) => m.bindTooltip(text, { permanent: true, direction: "top", offset: [0, -8] });
  label(L.circleMarker(where, { radius: 10, color: "#fff", weight: 3, fillColor: "#d93a2b", fillOpacity: 1 }).addTo(map), "Wohnung");
  const pts = [where], parts = [];
  for (const p of places()) {
    const at = [p.lat, p.lon];
    label(L.circleMarker(at, { radius: 7, color: "#fff", weight: 2, fillColor: p.color || "#2f6fde", fillOpacity: 1 }).addTo(map), p.name);
    pts.push(at);
    parts.push(`${p.name} ${km(where, at).toLocaleString("de-DE", { maximumFractionDigits: 1 })} km`);
  }
  map.fitBounds(pts, { padding: [36, 36], maxZoom: 15 });
  dist.textContent = parts.length ? "Luftlinie: " + parts.join(" · ") : "";
}

function openDetail(key) {
  openKey = key;
  drawDetail();
  const dlg = document.getElementById("detail");
  if (!dlg.open) { dlg.showModal(); history.pushState({ layer: "detail" }, ""); }
  dlg.scrollTop = 0;
}
document.getElementById("detail").addEventListener("close", () => { openKey = null; });
// Zurück-Taste/-Geste des Handys schließt Bildbetrachter bzw. Anzeige statt die Seite zu verlassen:
// beim Öffnen gibt es einen Eintrag im Verlauf, "Zurück" nimmt ihn wieder weg.
window.addEventListener("popstate", () => {
  const layer = history.state && history.state.layer;
  const viewer = document.getElementById("viewer"), detail = document.getElementById("detail");
  if (layer !== "viewer" && viewer.open) viewer.close();
  if (!layer && detail.open) detail.close();
});
// Mit ✕ geschlossen: den eigenen Verlaufseintrag wieder entfernen
for (const [id, layer] of [["viewer", "viewer"], ["detail", "detail"]]) {
  document.getElementById(id).addEventListener("close", () => {
    if (history.state && history.state.layer === layer) history.back();
  });
}

async function refresh() {
  try {
    const r = await fetch("offers.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    offers = data.offers || {};
    updated = data.updated || null;
    lastAuto = data.last_auto || null;
    lastManual = data.last_manual || null;
    // Neue Daten nach dem Start von hier: Lauf ist durch
    if (startedAt && updated && new Date(updated).getTime() > startedAt) startedAt = 0;
  } catch (e) {
    document.getElementById("status").textContent = "Liste konnte nicht geladen werden.";
  }
  render();
}

document.querySelectorAll("[data-min]").forEach(b => b.addEventListener("click", () => { minStars = +b.dataset.min; render(); }));
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => {
  view = b.dataset.view;
  try { localStorage.setItem("view", view); } catch (e) {}
  render();
  window.scrollTo(0, 0);
}));
document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
  newestFirst = b.dataset.sort === "new";
  try { localStorage.setItem("sort", b.dataset.sort); } catch (e) {}
  render();
}));
// ---- Bot von der App aus starten (GitHub "workflow_dispatch")
function getToken() { try { return localStorage.getItem("gh_token") || ""; } catch (e) { return ""; } }
function setToken(t) { try { t ? localStorage.setItem("gh_token", t) : localStorage.removeItem("gh_token"); } catch (e) {} }
const tokenDlg = document.getElementById("token"), tokenMsg = document.getElementById("token-msg");

async function startBot() {
  const token = getToken();
  if (!token) { tokenMsg.textContent = ""; tokenDlg.showModal(); return; }
  const run = document.getElementById("run");
  run.disabled = true; run.textContent = "startet …";
  let res = null;
  try {
    res = await fetch(DISPATCH, {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28" },
      body: JSON.stringify({ ref: "main", inputs: { source: "app" } }),
    });
  } catch (e) { /* kein Netz */ }
  if (res && res.status === 204) {
    startedAt = Date.now();
    render();
    setTimeout(refresh, 100e3);
    setTimeout(refresh, 150e3);
    return;
  }
  render();
  if (res && [401, 403, 404].includes(res.status)) {
    setToken("");
    tokenMsg.textContent = `GitHub hat den Token abgelehnt (${res.status}). Bitte neu eingeben.`;
    tokenDlg.showModal();
  } else {
    document.getElementById("status").textContent = "Start hat nicht geklappt" + (res ? ` (${res.status})` : " (kein Netz)") + ".";
  }
}
document.getElementById("run").addEventListener("click", startBot);
document.getElementById("token-cancel").addEventListener("click", () => tokenDlg.close());
document.getElementById("token-save").addEventListener("click", () => {
  const t = document.getElementById("token-input").value.trim();
  if (!t) { tokenMsg.textContent = "Bitte den Token einfügen."; return; }
  setToken(t);
  document.getElementById("token-input").value = "";
  tokenDlg.close();
  startBot();
});

refresh();
setInterval(refresh, 120e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
