<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#131314">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Wohnungen</title>
<style>
  /* Look der WorkTime-App: fast schwarze Flächen, Knochenweiß als Schrift, Mono für Zahlen,
     erhabene Kacheln mit weichem Licht oben links. Immer dunkel. Gold = Bewertung, Salbei = läuft. */
  :root {
    color-scheme: dark;
    --bg: #131314; --panel: #0d0d0e; --card: #171718; --ink: #ece7dc; --body: #d6d1c6; --muted: #9c988f;
    --faint: #827e76; --line: rgba(255,255,255,.08);
    --star: #c99a3b; --chip: #0d0d0e;
    --sent: #9db58f; --sent-ink: #10140e;
    --idle: #1c1c1d; --idle-ink: #d6d1c6;
    --late: #3a1f1b; --late-ink: #e7a99f;
    --red: #b83a2d; --blue: #6f97a6;
    --hi: rgba(255,255,255,.055); --lo: rgba(0,0,0,.7);
    --grad-raised: linear-gradient(145deg, #1a1a1b, #111112);
    --sh-raised: -3px -3px 8px var(--hi), 4px 4px 11px var(--lo);
    --sh-small: -2px -2px 5px var(--hi), 3px 3px 7px var(--lo);
    --sh-sunk: inset 3px 3px 8px rgba(0,0,0,.85), inset -2px -2px 5px rgba(255,255,255,.045);
    --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "Geist", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
         font: 15.5px/1.45 var(--sans); }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--star); outline-offset: 2px; }
  header { position: sticky; top: 0; z-index: 2; background: rgba(19,19,20,.92); backdrop-filter: blur(12px);
           -webkit-backdrop-filter: blur(12px); padding: 12px 16px 12px;
           padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
  header > * { max-width: 720px; margin-left: auto; margin-right: auto; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  h1 #count { font: 500 13px var(--mono); color: var(--muted); margin-left: 4px; vertical-align: 3px; }
  #status { color: var(--muted); font: 12px var(--mono); margin-top: 3px; }
  #status.stale { color: var(--late-ink); background: var(--late); display: inline-block;
                  padding: 2px 8px; border-radius: 8px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { flex: 1; }
  #run { background: var(--grad-raised); box-shadow: var(--sh-small); border: 1px solid rgba(255,255,255,.035);
         border-radius: 999px; padding: 9px 15px 9px 13px; font-size: 14px; font-weight: 550; white-space: nowrap;
         display: flex; align-items: center; gap: 8px; }
  #run::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sent);
                 box-shadow: 0 0 6px var(--sent); }
  #run:disabled { color: var(--muted); }
  #run:disabled::before { background: var(--star); box-shadow: 0 0 6px var(--star); }
  #run:active { box-shadow: var(--sh-sunk); }
  #runs { color: var(--muted); font: 12px var(--mono); margin-top: 1px; }
  #runs.never { color: var(--late-ink); }
  #token { width: min(92vw, 420px); height: fit-content; border-radius: 20px; padding: 20px; margin: auto;
           background: var(--grad-raised); color: var(--ink); border: 1px solid rgba(255,255,255,.05); box-shadow: var(--sh-raised); }
  #token::backdrop { background: rgba(0,0,0,.6); }
  #token h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
  #token p { color: var(--muted); font-size: 14px; margin: 6px 0; }
  #token input { width: 100%; padding: 12px; border-radius: 12px; border: 0; margin: 10px 0;
                 background: var(--panel); box-shadow: var(--sh-sunk); color: var(--ink); font: 14px var(--mono); }
  #token .row { display: flex; gap: 8px; }
  #token .row button { flex: 1; padding: 12px; border-radius: 12px; background: var(--grad-raised); box-shadow: var(--sh-small); font-weight: 600; }
  #token .row .ok { background: var(--ink); color: var(--bg); box-shadow: none; }
  #token a { color: inherit; }
  /* Schalter wie in der WorkTime-App: eingelassene Schiene, das aktive Feld steht hervor */
  .bar { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .seg { background: none; border-radius: 999px; padding: 7px 12px; font-size: 13.5px; color: var(--muted); }
  .seg[aria-pressed="true"] { color: var(--ink); background: linear-gradient(145deg, #222223, #161617); box-shadow: var(--sh-small); }
  #filters { background: var(--panel); box-shadow: var(--sh-sunk); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: nowrap; }
  #filters .seg { padding: 7px 11px; }
  .gap { flex: 1; }
  .tabs { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
          background: var(--panel); box-shadow: var(--sh-sunk); border-radius: 999px; padding: 3px; }
  .tabs .seg { font-weight: 550; padding: 9px 6px; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .tabs .seg[aria-pressed="true"]::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--star); }
  .section { font-size: 14px; font-weight: 550; color: var(--muted); margin: 26px 4px 10px; display: flex; gap: 8px; align-items: baseline; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 8px; font: 600 11px var(--mono);
           margin-left: 8px; letter-spacing: .02em; vertical-align: 1px; background: var(--sent); color: var(--sent-ink); }
  .badge.soon { background: var(--star); color: #1c1300; }
  main { padding: 14px 16px 48px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--grad-raised); border-radius: 22px; margin-bottom: 18px; overflow: hidden;
          border: 1px solid rgba(255,255,255,.035); box-shadow: var(--sh-raised); }
  .card .tap { display: flex; gap: 10px; padding: 14px 14px 12px 16px; width: 100%; text-align: left; background: none; align-items: center; flex-wrap: wrap; }
  .card .tap > .route { flex-basis: 100%; margin-top: -2px; }
  /* Alle Fotos direkt in der Liste: zum Wischen */
  .strip { display: flex; gap: 3px; overflow-x: auto; scroll-snap-type: x mandatory; height: 210px;
           background: var(--panel); scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip img { height: 100%; width: 82%; flex: none; object-fit: cover; scroll-snap-align: start; display: block; }
  .strip.one img { width: 100%; }
  .strip.withplan img { width: 50%; }
  .plantile { flex: none; width: 50%; height: 100%; position: relative; isolation: isolate; background: #0b0b0c;
              scroll-snap-align: start; overflow: hidden; }
  .strip.withplan .plantile img { width: 100%; height: 100%; object-fit: contain; padding: 8px;
              filter: invert(1) grayscale(1) contrast(2) brightness(1.2) drop-shadow(0 0 .4px #fff) drop-shadow(0 0 .4px #fff); }
  .plantile::after { content: ""; position: absolute; inset: 0; background: #e8bd5c; mix-blend-mode: multiply; pointer-events: none; }
  .strip .none { margin: auto; color: var(--faint); font: 12px var(--mono); }
  .count { position: absolute; right: 10px; top: 10px; background: rgba(13,13,14,.72); color: var(--ink);
           font: 11px var(--mono); padding: 3px 8px; border-radius: 999px; pointer-events: none; backdrop-filter: blur(6px); }
  .pics { position: relative; }
  .bez { color: var(--ink); font-weight: 600; }
  .info { min-width: 0; flex: 1; }
  .stars .badge:first-of-type { margin-left: 10px; }
  .stars { color: var(--star); letter-spacing: 1.5px; font-size: 14px; display: flex; align-items: center; flex-wrap: wrap; row-gap: 4px; }
  .stars small { color: var(--muted); letter-spacing: 0; margin-left: 8px; font: 12px var(--mono); }
  .main-line { font-weight: 600; font-size: 17px; margin: 5px 0 3px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .main-line .u { color: var(--muted); font-weight: 450; font-size: 14px; }
  .main-line .u:not(:last-child) { margin-right: 10px; }
  .route { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 5px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .route .r { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .route b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
  .route .ln { font-family: var(--mono); font-size: 11px; line-height: 1; padding: 3px 5px 2px; border-radius: 5px;
               color: #0d0d0e; background: #9c988f; font-weight: 600; }
  .route .ln.S { background: #9db58f; } .route .ln.U { background: #6f97a6; }
  .route .ln.T { background: #c99a3b; } .route .ln.B { background: #a97df5; } .route .ln.R { background: #b83a2d; color: #ece7dc; }
  .route .ar { color: var(--faint, #827e76); font-size: 11px; }
  .sub { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req { display: block; width: calc(100% - 28px); margin: 0 14px 14px; padding: 12px; border-radius: 14px;
         font-weight: 600; font-size: 15px; background: var(--panel); color: var(--idle-ink); box-shadow: var(--sh-sunk); }
  .req.late { background: var(--late); color: var(--late-ink); box-shadow: none; }
  a.req { text-align: center; text-decoration: none; box-sizing: border-box; }
  .req.go { background: var(--ink); color: var(--bg); box-shadow: none; }
  .req.ask { background: var(--star); color: #1c1300; box-shadow: none; }
  .req.sent { background: rgba(157,181,143,.14); color: var(--sent); box-shadow: inset 0 0 0 1px rgba(157,181,143,.3); }
  .req.invite { background: var(--star); color: #1c1300; box-shadow: none; }
  .req.declined { background: var(--panel); color: var(--faint); }
  .req small { font-weight: 400; opacity: .85; margin-left: 6px; }
  .gone { color: var(--late-ink); }
  .link.off { background: var(--panel); color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 56px 12px; }

  /* Netzdiagramm: sechs Achsen, die Form zeigt, worin die Wohnung stark ist. Gefüllt mit Rasterpunkten
     wie die Zeitpunkte in der WorkTime-App. */
  .radar { flex: none; width: 132px; height: 128px; margin: -6px -8px -6px 0; display: block; overflow: visible; }
  .radar .web { fill: none; stroke: rgba(255,255,255,.09); stroke-width: 1; }
  .radar .web.outer { stroke: rgba(255,255,255,.16); }
  .radar { --rc: #c99a3b; }
  .radar .dots circle { fill: var(--rc); }
  .radar .shape { fill: color-mix(in srgb, var(--rc) 9%, transparent); stroke: var(--rc); stroke-width: 1.6; stroke-linejoin: round;
                  filter: drop-shadow(0 0 3px color-mix(in srgb, var(--rc) 55%, transparent)) drop-shadow(0 0 8px rgba(111,151,166,.22)); }
  .radar .tip-dot { fill: var(--rc); }
  .radar text { font: 500 9.5px var(--sans); fill: var(--muted); }
  .radar.big { width: 100%; max-width: 300px; height: auto; margin: 4px auto 0; }
  .radar.big text { font-size: 11px; }
  .radar.big text.v { font: 600 11px var(--mono); }
  .radar.big text.v { fill: var(--ink); }
  .radar-box { background: var(--panel); box-shadow: var(--sh-sunk); border-radius: 20px; padding: 14px 10px 6px; }

  dialog { border: 0; padding: 0; margin: 0; width: 100%; max-width: 100%; height: 100%; max-height: 100%;
           background: var(--bg); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  .sheet { max-width: 720px; margin: 0 auto; padding-bottom: 110px; }
  .close { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 3; width: 42px;
           height: 42px; border-radius: 50%; background: rgba(13,13,14,.72); color: var(--ink); font-size: 18px;
           backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: var(--sh-small); }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: var(--panel);
             min-height: 120px; }
  .gallery img { width: 100%; flex: none; scroll-snap-align: center; aspect-ratio: 4 / 3; object-fit: cover;
                 display: block; }
  .gallery.many img { width: 88%; margin-right: 4px; }
  .body { padding: 16px 16px; }
  .body h2 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; margin: 6px 0 4px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
  .chip { background: var(--panel); box-shadow: var(--sh-sunk); border-radius: 999px; padding: 5px 11px; font-size: 13.5px; color: var(--body); }
  h3 { font-size: 15px; font-weight: 600; color: var(--ink); margin: 28px 0 10px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); }
  td:last-child { text-align: right; }
  .part { display: grid; grid-template-columns: 108px 1fr 54px; gap: 8px; align-items: center;
          font-size: 14px; margin: 7px 0; font-variant-numeric: tabular-nums; }
  .track { height: 6px; border-radius: 3px; background: var(--panel); box-shadow: var(--sh-sunk); overflow: hidden; }
  .fill { height: 100%; background: var(--star); border-radius: 3px; }
  .part span:last-child { text-align: right; color: var(--muted); font: 12px var(--mono); }
  .text { white-space: pre-line; overflow-wrap: anywhere; color: var(--body); }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(19,19,20,.92); border-top: 1px solid var(--line);
          backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
          padding: 10px 16px max(10px, env(safe-area-inset-bottom)); }
  .foot .in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  .foot .req { margin: 0; width: auto; flex: 1; }
  /* Fotos in voller Größe zum Durchwischen */
  dialog.viewer { background: #000; color: #fff; }
  .viewer .frames { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .viewer .frames::-webkit-scrollbar { display: none; }
  .viewer .frames img { flex: none; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
  .viewer .pos { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); text-align: center;
                 font: 13px var(--mono); text-shadow: 0 1px 3px #000; pointer-events: none; }
  .strip img, .gallery img { cursor: zoom-in; }
  /* Karte in der Anzeige */
  #map { height: 280px; border-radius: 18px; background: var(--panel); z-index: 0; }
  #map .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.62) contrast(1.25); }
  .dist { color: var(--muted); font-size: 13.5px; margin-top: 10px; }
  .places-btn { background: var(--grad-raised); box-shadow: var(--sh-small); border-radius: 999px; padding: 7px 13px; font-size: 14px; margin-top: 10px; }
  /* Grundriss in der Anzeige: ganz zeigen, weißer Grund (oft GIF/PNG mit Transparenz) */
  .plans img { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: #fff;
               border-radius: 14px; margin-bottom: 8px; cursor: zoom-in; }
  .badge.plan { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
  /* Statistik: "Nachtplan" – Berlin bei Nacht. Natriumdampf-Laternen (Bernstein) für Wohnungen,
     S-Bahn-Grün für den Ring und alles, was eine Runde weiter kam. Immer dunkel, egal welches Handy-Thema. */
  body.night main { max-width: 760px; }
  .stats { --nb: #131314; --np: #0d0d0e; --nl: rgba(255,255,255,.08); --ni: #ece7dc; --nm: #9c988f; --amber: #e0ac4c;
           --sgreen: #9db58f; --slate: #5a5752; --slate2: #3a3936;
           color: var(--ni); font-family: var(--sans); display: grid; gap: 34px; padding-bottom: 20px; }
  .stats h4, .stats .lede, .stats .num { font-family: var(--sans); }
  .stats h4 { margin: 0 0 4px; font-size: 22px; line-height: 1.15; font-weight: 600; letter-spacing: -.005em; max-width: 30ch; }
  .stats .how { color: var(--nm); font-size: 13.5px; line-height: 1.45; margin: 0 0 12px; max-width: 58ch; }
  .lede { margin: 6px 0 0; display: grid; gap: 2px; }
  .lede p { margin: 0; font-size: 21px; line-height: 1.18; font-weight: 500; color: var(--nm); }
  .lede .num { font-size: 50px; line-height: .95; font-weight: 700; color: var(--ni); letter-spacing: -.02em;
               font-variant-numeric: tabular-nums; margin-right: 6px; }
  .lede p.go .num { color: var(--sgreen); }
  .lede small { color: var(--nm); font-size: 13.5px; margin-top: 10px; display: block; }
  .nightmap, .nightmap.leaflet-container { height: 470px; margin: 0 -16px; background: #050505; z-index: 0; border-top: 1px solid var(--nl); border-bottom: 1px solid var(--nl);
              font-family: var(--sans); }
  .nightmap .fine { filter: grayscale(1) invert(1) brightness(.85) contrast(1.1); mix-blend-mode: screen; opacity: .5; }
  .nightmap .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.5) contrast(1.35); }
  .nightmap:has(.park) .leaflet-tile-pane { filter: none; }
  .nightmap .park { fill: url(#parkdots); }
  .nightmap .water { fill: #2a2d32; }
  .nightmap .river { stroke: #2a2d32; fill: none; }
  .nightmap path.flat { filter: drop-shadow(0 0 3px var(--fc, #e0ac4c)); }
  .nightmap path.flat.asked { filter: drop-shadow(0 0 6px rgba(255,255,255,.7)); }
  .nightmap .leaflet-control-attribution { background: rgba(5,5,5,.7); color: var(--nm); font-size: 10px; }
  .nightmap .leaflet-control-attribution a { color: var(--nm); }
  .nightmap .leaflet-bar { border: 0; box-shadow: var(--sh-small); border-radius: 12px; overflow: hidden; }
  .nightmap .leaflet-bar a.leaflet-disabled { background: #161617; color: #444; }
  .nightmap .leaflet-bar a { background: #161617; color: var(--ni); border-bottom-color: var(--nl); width: 34px; height: 34px; line-height: 34px; }
  .mlbl { white-space: nowrap; pointer-events: none; }
  .mlbl span { position: absolute; transform: translateY(-50%); font-weight: 500; color: rgba(255,255,255,.5);
               text-shadow: 0 0 3px #050505, 0 0 6px #050505, 0 0 1px #050505; }
  .mlbl.hub span { left: 8px; font-weight: 650; font-size: 12.5px; color: #fff; letter-spacing: -.005em; }
  .mlbl.hub.t2 span { left: 6px; font-weight: 550; font-size: 11px; color: rgba(255,255,255,.78); }
  .mlbl.hub i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #fff;
                box-shadow: 0 0 0 2.5px #050505, 0 0 10px rgba(255,255,255,.55); }
  .mlbl.hub.t2 i { left: -3.5px; top: -3.5px; width: 7px; height: 7px; box-shadow: 0 0 0 2px #050505; }
  .mlbl.mine span { left: 9px; font-weight: 650; font-size: 12.5px; color: #050505; background: #fff; padding: 1px 6px; border-radius: 6px; text-shadow: none; }
  .mlbl.mine i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; background: #fff; transform: rotate(45deg); box-shadow: 0 0 0 2px #050505; }
  .mlbl.area span { transform: translate(-50%, -50%); font-size: 11.5px; letter-spacing: .03em; color: rgba(255,255,255,.42); }
  .mlbl.area.t2 span { font-size: 10.5px; color: rgba(255,255,255,.3); }
  .nightmap.near .mlbl.area { display: none; }
  .nightmap:not(.mid) .mlbl.mine span { display: none; }
  .key { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--nm); font-size: 12.5px; margin-top: 10px; align-items: center; }
  .key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .key .scalek { width: 30px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgb(138,134,126), rgb(222,182,58), rgb(122,196,104)); }
  .key .topk { background: #a97df5; box-shadow: 0 0 6px #a97df5; }
  .key .hubk { background: #fff; box-shadow: 0 0 0 2px #050505, 0 0 0 3px rgba(255,255,255,.3); }
  .key .askk { background: rgb(122,196,104); width: 12px; height: 12px; border: 2px solid #fff; }
  .key .ringk { width: 16px; height: 0; border-top: 3px solid #fff; border-radius: 0; }
  .key .placek { background: #fff; border-radius: 0; transform: rotate(45deg); width: 8px; height: 8px; }
  .river { width: 100%; height: auto; display: block; overflow: visible; }
  .river text { font: 500 12.5px var(--sans); fill: var(--ni); }
  .river .sub { fill: var(--nm); font-size: 11.5px; }
  .river .band { opacity: .55; transition: opacity .15s; }
  .river .band.hot { opacity: .95; }
  .clock { width: 100%; height: auto; display: block; }
  .clock text { font: 500 11px var(--sans); fill: var(--nm); }
  .clock .cellbg { fill: #1b1b1c; }

<script>
"use strict";
const HOUR = 3600e3;
const LATE_AFTER = 2 * HOUR;          // rötlich: so lange online und keine Anfrage
const STALE_AFTER = 45 * 60e3;        // Warnung: Bot hat so lange nichts aktualisiert
const DISPATCH = "https://api.github.com/repos/joshuaperlbach-dot/Wohnungs-such-Bot/actions/workflows/wbm.yml/dispatches";
let offers = {}, updated = null, lastAuto = null, lastManual = null, startedAt = 0;
let minStars = 0, openKey = null;
// Tab: alle Angebote oder nur die eigenen Anfragen (merkt sich das Gerät)
let view = (() => { try { const v = localStorage.getItem("view"); return v === "mine" || v === "stats" ? v : "offers"; } catch (e) { return "offers"; } })();
// Sortierung merkt sich das Gerät
let newestFirst = (() => { try { return localStorage.getItem("sort") === "new"; } catch (e) { return false; } })();

// Eigene Markierungen ("von Hand angefragt") bleiben nur auf diesem Gerät gespeichert.
function loadMarks() {
  try { return JSON.parse(localStorage.getItem("marks") || "{}"); } catch (e) { return {}; }
}
function saveMarks(m) {
  try { localStorage.setItem("marks", JSON.stringify(m)); } catch (e) { /* privater Modus */ }
}
let marks = loadMarks();
// "Nicht weiter verfolgen" (z.B. nach der Besichtigung): nur auf diesem Gerät
let dropped = (() => { try { return JSON.parse(localStorage.getItem("dropped") || "{}"); } catch (e) { return {}; } })();
function toggleDropped(key) {
  if (dropped[key]) delete dropped[key]; else dropped[key] = new Date().toISOString();
  try { localStorage.setItem("dropped", JSON.stringify(dropped)); } catch (e) {}
  render();
}
// Angebote, deren Anfrage-Seite von hier geöffnet wurde (danach fragt der Knopf, ob es geklappt hat)

// Link springt, wo möglich, direkt zum Anfrage-Formular der Gesellschaft (wie in der Push-Meldung)
const FORM_ANCHOR = { degewo: "#accordion-nl-rent-details" };
const formUrl = o => { const u = safeUrl(o.url); return u && !u.includes("#") ? u + (FORM_ANCHOR[o.company] || "") : u; };

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;

};
const safeUrl = u => (typeof u === "string" && /^https:\/\//.test(u)) ? u : null;
// Bilder: Adresse der Gesellschaft oder vom Bot gesicherte Kopie (docs/img/...)
const imgUrl = u => safeUrl(u) || ((typeof u === "string" && /^img\/[\w-]+\/[\w.-]+$/.test(u)) ? u : null);

  Number(v).toLocaleString("de-DE", { minimumFractionDigits: digits, maximumFractionDigits: digits });

function ago(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  if (!isFinite(ms)) return "";
  if (ms < 90e3) return "gerade eben";
  if (ms < HOUR) return `vor ${Math.round(ms / 60e3)} Min`;

const COMPANY = { wbm: "WBM", degewo: "degewo", howoge: "HOWOGE", gewobag: "Gewobag", gesobau: "GESOBAU",

function state(key, o) {
  if (dropped[key]) return { cls: "declined", label: "Nicht weiter verfolgt", note: "deine Entscheidung", locked: true };
  if (isQuiet(o)) return { cls: "declined", label: "Wohl nichts geworden", note: quietReason(o), locked: true };
  // Antwort der Gesellschaft, vom Bot aus der Mail gelesen
  if (o.termin && o.reply !== "absage") {
    const v = viewing(o);

    if (v) return { cls: "invite", label: "Termin gebucht", note: v.text.replace("Besichtigung ", ""), locked: true };
  }
  if (o.reply === "einladung") return { cls: "invite", label: "Einladung zur Besichtigung", note: "schau in deine Mails", locked: true };
  if (o.reply === "selbstauskunft") return { cls: "invite", label: "Selbstauskunft ausfüllen!", note: "Link in der WBM-Mail, 24 Std", locked: true };
  if (o.reply === "absage") return { cls: "declined", label: "Absage", note: "Anfrage war raus", locked: true };
  if (o.reply === "antwort") return { cls: "sent", label: "Antwort da", note: "schau in deine Mails", locked: true };
  // degewo: nach der Anfrage noch ein zweites Formular; das füllt der Bot selbst aus

    return { cls: "sent", label: "Angefragt", note: "zweites Formular vom Bot ausgefüllt", locked: true };
  }
  if (o.confirm === "formular" && !o.reply) {
    return { cls: "ask", label: "Zweites Formular offen", note: "Bot füllt aus, sonst kommt eine Push-Meldung", locked: true };
  }
  if (o.confirm === "abgelaufen") return { cls: "declined", label: "Anfrage nicht bestätigt", note: "Link aus der Mail abgelaufen", locked: true };
  if (o.requested === "unklar" && o.confirm === "offen") {
    return { cls: "sent", label: "Anfrage raus", note: "Bestätigung per Mail offen", locked: true };
  }
  if (o.requested === "gesendet" || o.requested === "unklar") {
    return { cls: "sent", label: "Angefragt", note: o.via === "mail" ? "Eingang per Mail bestätigt"
             : o.requested === "unklar" ? "vom Bot, ohne Bestätigung" : "vom Bot",
             locked: true };
  }
  if (marks[key]) return { cls: "sent", label: "✓ Von dir angefragt", note: "tippen zum Zurücknehmen", toggle: true };
  // Nach dem Öffnen eine Stunde lang nachfragen; danach (z.B. doch nicht angefragt) wieder normal
  if (opened[key] && !o.gone && Date.now() - new Date(opened[key]).getTime() < HOUR) {
    return { cls: "ask", label: "Angefragt?", note: "tippen = ja", toggle: true };
  }
  if (o.gone) return { cls: "", label: "Als angefragt markieren", note: "", toggle: true };
  const url = formUrl(o);
  const online = Date.now() - new Date(o.online_since).getTime();
  const late = online > LATE_AFTER;
  const note = late ? `online ${ago(o.online_since).replace("vor ", "seit ")}` : "öffnet das Formular";
  return { cls: late ? "late" : "go", label: url ? "Jetzt anfragen ↗" : "Als angefragt markieren", note, url };
}

function reqButton(key, o) {
  const s = state(key, o);
  // Noch nicht angefragt: der Knopf öffnet direkt das Formular der Gesellschaft
  const b = s.url ? el("a", "req " + s.cls, s.label) : el("button", "req " + s.cls, s.label);
  if (s.note) b.append(el("small", null, s.note));
  if (s.url) {
    b.href = s.url; b.target = "_blank"; b.rel = "noopener noreferrer";
    b.addEventListener("click", ev => {
      ev.stopPropagation();
      opened[key] = new Date().toISOString();
      saveOpened();
      setTimeout(render, 500);  // zurück in der App: Knopf fragt dann, ob es geklappt hat
    });
    return b;
  }
  b.addEventListener("click", ev => {
    ev.stopPropagation();
    if (s.locked) return;
    if (marks[key]) { delete marks[key]; delete opened[key]; } else marks[key] = { at: new Date().toISOString(), offer: o };
    saveMarks(marks); saveOpened();
    render();
  });
  return b;
}

function all() {
  // Von Hand angefragte Angebote bleiben sichtbar, auch wenn der Bot sie schon aussortiert hat.
  const merged = {};
  for (const [k, m] of Object.entries(marks)) if (m && m.offer) merged[k] = m.offer;
  const out = { ...merged, ...offers };
  // Von Hand markiert: der Zeitpunkt der Markierung gilt als Anfragezeit (für "Wohl nichts geworden")
  for (const [k, m] of Object.entries(marks)) {
    if (out[k] && m && m.at && !out[k].requested_at) out[k] = { ...out[k], requested_at: m.at };
  }
  return Object.entries(out);
}

function render() {
  const items = all().filter(([, o]) => (o.stars || 0) >= minStars);
  items.sort(([, a], [, b]) => newestFirst
    ? new Date(b.online_since) - new Date(a.online_since)
    : (b.points ?? b.stars * 20) - (a.points ?? a.stars * 20) || new Date(b.online_since) - new Date(a.online_since));
  document.getElementById("count").textContent = `(${items.length})`;
  document.querySelectorAll("[data-min]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.min === minStars)));
  document.querySelectorAll("[data-sort]").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.sort === "new") === newestFirst)));

  if (updated) {
    const stale = Date.now() - new Date(updated).getTime() > STALE_AFTER;

  list.replaceChildren();
  if (view === "mine") {

    renderStats(list);
  } else {
    if (!items.length) list.append(el("div", "empty", updated ? "Gerade keine passenden Angebote." : "lädt …"));
    for (const [key, o] of items) list.append(makeCard(key, o));

// ---- Tab "Meine Anfragen": oben was läuft, darunter die Absagen; Besichtigungen markiert
function isMine(key, o) {
  return o.requested === "gesendet" || o.requested === "unklar" || !!marks[key] || !!o.reply;
}
function isLost(o) { return o.reply === "absage" || o.confirm === "abgelaufen"; }
// Wohl nichts geworden: Die HOWOGE lädt meist nach 1–3 Tagen ein, sonst nie; eine Einladung ohne gebuchten

function quietReason(o) {
  if (isLost(o)) return null;
  const t = v => new Date(v || 0).getTime() || 0;
  const age = Date.now() - Math.max(t(o.requested_at), t(o.reply_at), t(o.termin));
  if (!Math.max(t(o.requested_at), t(o.reply_at), t(o.termin))) return null;
  if (o.reply === "einladung" && !o.termin && age > 2 * 24 * HOUR) return "Einladung verfallen";
  if (o.company === "howoge" && !o.reply && !o.termin && age > 7 * 24 * HOUR) return "nicht ausgelost";
  if (age > 14 * 24 * HOUR) return "seit über 2 Wochen nichts";
  return null;
}
const isQuiet = o => !!quietReason(o);
function viewing(o) {   // Besichtigungstermin (vom Bot aus der Terminbestätigung gelesen)
  const t = o.termin ? new Date(o.termin) : null;
  if (!t || !isFinite(t)) return null;
  const when = t.toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  return Date.now() > t.getTime() + 30 * 60e3 ? { cls: "", text: "✓ Besichtigt" } : { cls: "soon", text: `Besichtigung ${when}` };
}
function renderMine(list) {
  const mine = all().filter(([k, o]) => isMine(k, o));

  if (!mine.length) { list.append(el("div", "empty", updated ? "Noch keine Anfragen." : "lädt …")); return; }
  list.append(el("div", "section", `Läuft gerade (${open.length})`));

  for (const [key, o] of open) list.append(makeCard(key, o));

function drawNightMap(L, mapBox, flats, places) {
  const map = L.map(mapBox, { scrollWheelZoom: false, dragging: !L.Browser.mobile, tap: false, zoomControl: true,
                              attributionControl: true, minZoom: 10, maxZoom: 17, zoomSnap: 0.5 });
  map.attributionControl.setPrefix(false);
  const bm = basemap;
  const fine = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, className: "fine",
    attribution: "© OpenStreetMap" });
  if (!bm) fine.addTo(map);
  if (bm) {
    for (const [name, z] of [["water", 410], ["base", 420], ["rail", 430], ["flats", 600], ["labels", 650]]) {
      map.createPane(name).style.zIndex = z;
    }
    map.getPane("labels").style.pointerEvents = "none";
    const cv = L.canvas({ pane: "base", padding: 0.3 }), rv = L.canvas({ pane: "rail", padding: 0.3 });
    const sv = L.svg({ pane: "water", padding: 0.3 });
    const line = (key, o) => { for (const f of bm[key] || []) L.polyline(pairs(f), { interactive: false, ...o }).addTo(map); };
    for (const f of bm.park || []) L.polygon(pairs(f), { renderer: sv, interactive: false, stroke: false, fillOpacity: 1, className: "park" }).addTo(map);
    for (const f of bm.water || []) L.polygon(pairs(f), { renderer: sv, interactive: false, stroke: false, fillOpacity: 1, className: "water" }).addTo(map);
    line("river", { renderer: sv, className: "river", weight: 3 });
    line("road2", { renderer: cv, color: "#fff", opacity: 0.17, weight: 1 });
    line("road1", { renderer: cv, color: "#fff", opacity: 0.26, weight: 1.7 });
    line("ubahn", { renderer: rv, color: "#fff", opacity: 0.28, weight: 1, dashArray: "2 3" });
    line("sbahn", { renderer: rv, color: "#fff", opacity: 0.5, weight: 1.3 });
    line("ring", { renderer: rv, color: "#fff", opacity: 1, weight: 3 });

    // Beschriftungen: Rang 0 = wichtigste
    const labels = [];
    const label = (ll, html, cls, rank) => {
      const m = L.marker(ll, { pane: "labels", interactive: false, keyboard: false,
        icon: L.divIcon({ className: "mlbl " + cls, html, iconSize: null }) }).addTo(map);
      labels.push({ m, rank, name: html.replace(/<[^>]+>/g, "") });
    };
    for (const [n, la, lo, tier] of bm.hubs || []) label([la, lo], `<i></i><span>${n}</span>`, "hub t" + tier, tier === 1 ? 0 : 3);
    for (const p of places) label([p.lat, p.lon], `<i></i><span>${p.name}</span>`, "mine", 1);
    for (const [n, la, lo, tier] of bm.areas || []) label([la, lo], `<span>${n}</span>`, "area t" + tier, tier === 1 ? 2 : 4);
    // unter den großen Knoten zuerst die, an denen man sich am ehesten orientiert
    const PRIO = ["Alexanderplatz", "Hauptbahnhof", "Ostkreuz", "Südkreuz", "Gesundbrunnen", "Westkreuz", "Kottbusser Tor",
                  "Friedrichstraße", "Zoologischer Garten", "Warschauer Straße", "Potsdamer Platz", "Hermannplatz", "Ostbahnhof"];
    const prio = l => { const i = PRIO.indexOf(l.name); return i < 0 ? 99 : i; };
    labels.sort((a, b) => a.rank - b.rank || prio(a) - prio(b));
    const declutter = () => {
      const z = map.getZoom();
      if (z >= 14) fine.addTo(map); else fine.remove();
      mapBox.classList.toggle("near", z >= 14);
      mapBox.classList.toggle("mid", z >= 12);
      const kept = [];
      for (const { m, rank } of labels) {
        const e = m.getElement();
        if (!e) continue;
        // Startansicht ohne Text, Namen kommen erst beim Reinzoomen
        const allowed = rank === 1 || (rank === 0 && z >= 12) || (rank === 2 && z >= 12.5) || (rank === 3 && z >= 13) || (rank === 4 && z >= 13.5);
        e.style.visibility = "hidden";
        if (!allowed) continue;
        e.style.visibility = "";
        const parts = [...e.children].map(c => c.getBoundingClientRect()).filter(p => p.width > 0);
        e.style.visibility = "hidden";
        const r = { left: Math.min(...parts.map(p => p.left)), right: Math.max(...parts.map(p => p.right)),
                    top: Math.min(...parts.map(p => p.top)), bottom: Math.max(...parts.map(p => p.bottom)) };
        if (rank !== 1 && kept.some(k => r.left < k.right + 4 && r.right + 4 > k.left && r.top < k.bottom + 2 && r.bottom + 2 > k.top)) continue;
        e.style.visibility = "";
        kept.push(r);
      }
    };
    map.on("zoomend moveend", declutter);
    map.whenReady(() => setTimeout(declutter, 0));
  } else {
    for (const p of places) L.circleMarker([p.lat, p.lon], { radius: 5, color: "#000", weight: 2, fillColor: "#fff", fillOpacity: 1 })
      .addTo(map).bindTooltip(p.name, { permanent: true, direction: "right", offset: [6, 0], className: "placelabel" });
  }
  // Wohnungen: Farbe wie im Netzdiagramm, angefragte mit weißem Ring
  for (const it of flats) {
    const c = radarColor(it);
    const m = L.circleMarker(it.ll, { pane: bm ? "flats" : "overlayPane", radius: it.asked ? 6 : 3.6,
      color: it.asked ? "#fff" : c, weight: it.asked ? 2 : 0, fillColor: c, fillOpacity: it.asked ? 1 : 0.9,
      className: "flat" + (it.asked ? " asked" : "") }).addTo(map);
    const pe = m.getElement && m.getElement();
    if (pe) pe.style.setProperty("--fc", c);
    m.on("click", e => showTip(e.originalEvent, it.tip));
  }
  map.fitBounds([[52.44, 13.27], [52.58, 13.56]]);
  return map;
}

function showTip(ev, lines) {
  if (!tipEl) { tipEl = el("div", "tip"); document.body.append(tipEl); }
  tipEl.replaceChildren(el("b", null, lines[0]), ...lines.slice(1).map(t => el("span", null, t)));
  tipEl.style.display = "block";
  const r = tipEl.getBoundingClientRect();
  const x = Math.min(window.innerWidth - r.width - 8, Math.max(8, ev.clientX - r.width / 2));
  const y = ev.clientY - r.height - 14 < 8 ? ev.clientY + 18 : ev.clientY - r.height - 14;
  tipEl.style.left = `${x}px`; tipEl.style.top = `${y}px`;
}
function hideTip() { if (tipEl) tipEl.style.display = "none"; }
function hover(node, lines) {
  node.setAttribute("tabindex", "0");
  node.style.cursor = "pointer";
  const at = ev => ev && ev.clientX != null ? ev : (() => { const b = node.getBoundingClientRect(); return { clientX: b.left + b.width / 2, clientY: b.top }; })();
  const on = ev => { node.classList.add("hot"); showTip(at(ev), lines()); };
  node.addEventListener("pointerenter", on);
  node.addEventListener("pointermove", on);
  node.addEventListener("click", ev => { ev.stopPropagation(); on(ev); });
  node.addEventListener("focus", () => on());
  for (const t of ["pointerleave", "blur"]) node.addEventListener(t, () => { node.classList.remove("hot"); hideTip(); });
}
document.addEventListener("click", hideTip);
window.addEventListener("scroll", hideTip, { passive: true });
function block(title, how) {
  const c = el("section");
  c.append(el("h4", null, title));
  if (how) c.append(el("p", "how", how));
  return c;
}

function renderStats(list) {
  if (!histData) { loadHistory(); list.append(el("div", "empty", "Statistik lädt …")); return; }
  const rows = { ...histData };
  for (const [k, o] of all()) rows[k] = { ...(rows[k] || {}), ...o };
  const items = Object.entries(rows).map(([k, o]) => ({ k, ...o }));
  const isAsked = it => it.requested === "gesendet" || it.requested === "unklar" || !!marks[it.k];
  const asked = items.filter(isAsked);
  const byHand = it => !!marks[it.k] || it.via === "mail";
  const outcome = it => it.reply === "absage" || it.confirm === "abgelaufen" ? "absage"
    : ["einladung", "selbstauskunft"].includes(it.reply) || it.termin ? "weiter" : quietReason(it) ? "still" : "offen";
  const nBot = asked.filter(it => !byHand(it)).length, nMe = asked.length - nBot;
  const further = asked.filter(it => outcome(it) === "weiter");
  const visited = asked.filter(it => it.termin && Date.now() > new Date(it.termin).getTime() + 30 * 60e3);
  const times = items.map(it => new Date(it.online_since)).filter(d => isFinite(d));
  const first = times.length ? new Date(Math.min(...times)) : new Date();
  const days = Math.max(1, Math.round((Date.now() - first) / 864e5));
  document.getElementById("count").textContent = "";
  const wrap = el("div", "stats");
  list.append(wrap);

  // ---------- Einstieg: drei Sätze statt Kacheln
  const lede = el("div", "lede");
  const line = (n, text, cls) => { const p = el("p", cls); p.append(el("span", "num", String(n)), document.createTextNode(text)); return p; };
  lede.append(line(items.length, "Wohnungen passten zu deiner Suche."),
    line(asked.length, `hast du angefragt, ${nBot} davon der Bot.`),
    line(further.length, further.length === 1 ? "kam eine Runde weiter." : "kamen eine Runde weiter.", "go"),
    el("small", null, `Seit ${first.toLocaleDateString("de-DE", { day: "numeric", month: "long" })}, im Schnitt ${(items.length / days).toLocaleString("de-DE", { maximumFractionDigits: 1 })} passende Angebote am Tag. ${visited.length} Besichtigung${visited.length === 1 ? "" : "en"}.`));
  wrap.append(lede);

  // ---------- Nachtplan: jede Wohnung ein Licht
  const pos = it => Array.isArray(it.coord) && it.coord.length === 2 ? it.coord : coordsByKey[it.k];
  const lit = items.filter(it => pos(it));
  const inRing = lit.filter(it => ringInside(pos(it))).length;
  const mapSec = block(lit.length ? `Nur ${pct(inRing, lit.length)} % der passenden Wohnungen liegen im S-Bahn-Ring`
                                  : "Wo die passenden Wohnungen liegen",
    lit.length < items.length * 0.8 ? `Jede Wohnung ein Punkt, Farbe nach Sternen. ${items.length - lit.length} Adressen sind noch nicht auf der Karte, der Bot trägt sie nach.`
                                    : "Jede Wohnung ein Punkt, Farbe nach Sternen wie im Netzdiagramm. Antippen zeigt Miete und Größe, zwei Finger zoomen.");
  const mapBox = el("div", "nightmap");
  mapSec.append(mapBox);
  const key = el("div", "key");
  const k = (cls, t) => { const s = el("span"); s.append(el("i", cls), document.createTextNode(t)); return s; };
  key.append(k("scalek", "Wohnung, grau bis grün nach Sternen"), k("topk", "5 Sterne"),
    k("askk", "angefragt"), k("ringk", "S-Bahn-Ring"), k("hubk", "Knotenbahnhof"));
  if (places().length) key.append(k("placek", "deine Orte"));
  mapSec.append(key);
  wrap.append(mapSec);
  requestAnimationFrame(async () => {
    const [L] = await Promise.all([leaflet(), loadBasemap()]);
    if (!L || !mapBox.isConnected) { mapBox.style.height = "auto"; mapBox.replaceChildren(el("p", "how", "Die Karte konnte nicht laden. Prüf die Verbindung und öffne den Tab neu.")); return; }
    const flats = [...lit].sort((a, b) => isAsked(a) - isAsked(b) || (a.points || 0) - (b.points || 0)).map(it => ({
      ll: pos(it), asked: isAsked(it), stars: it.stars, points: it.points,
      tip: [`${num(it.price)} € warm, ${num(it.size)} m²`, `${(it.address || "").split(",")[0]}, ${it.bezirk || ""}`,
            `${COMPANY[it.company] || it.company || ""}, ${"★".repeat(it.stars || 0)}${isAsked(it) ? ", angefragt" : ""}`] }));
    drawNightMap(L, mapBox, flats, places());
  });

  // ---------- River: was aus den Anfragen wurde
  const counts = {}; for (const o of Object.keys(OUTCOME)) counts[o] = 0;
  for (const it of asked) counts[outcome(it)]++;
  const riv = block(`Von ${asked.length} Anfragen kamen ${counts.weiter} weiter, ${counts.absage} endeten mit Absage`,
    "Links die Gesellschaften, rechts was aus den Anfragen wurde. Je breiter das Band, desto mehr Anfragen. „Keine Antwort“ heißt bei HOWOGE und WBM meist: nicht ausgelost.");
  riv.append(river(asked, outcome));
  wrap.append(riv);

  // ---------- Punkt-Uhr: wann neue Angebote kommen
  const cells = Array.from({ length: 7 }, () => Array(16).fill(0));   // Wochentag x Stunde 6–21
  for (const d of times) { const h = d.getHours(); if (h >= 6 && h < 22) cells[(d.getDay() + 6) % 7][h - 6]++; }
  let peak = [0, 0, 0];
  cells.forEach((r, i) => r.forEach((v, j) => { if (v > peak[0]) peak = [v, i, j]; }));
  const we = cells[5].concat(cells[6]).reduce((a, b) => a + b, 0), tot = cells.flat().reduce((a, b) => a + b, 0) || 1;
  const clk = block(peak[0] ? `Die meisten Angebote kommen ${WDL[peak[1]].toLowerCase()}s gegen ${6 + peak[2]} Uhr, am Wochenende fast keine`
                            : "Wann neue Angebote kommen",
    `Jeder Punkt ist eine Wohnung, nach Wochentag und Uhrzeit, zu der sie online ging. Samstag und Sonntag zusammen: ${pct(we, tot)} %.`);
  clk.append(dotClock(cells));
  wrap.append(clk);

  // ---------- Gesellschaften
  const comp = {};
  for (const it of items) (comp[it.company || "?"] ||= []).push(it);
  const cs = Object.entries(comp).map(([c, a]) => ({ c, a, name: COMPANY[c] || c,
    stars: avg(a.map(x => x.stars).filter(Number.isFinite)), qm: avg(a.filter(x => x.price && x.size).map(x => x.price / x.size)),
    asked: a.filter(isAsked).length, weiter: a.filter(x => isAsked(x) && outcome(x) === "weiter").length })).sort((x, y) => y.a.length - x.a.length);
  const solid = cs.filter(c => c.a.length >= 5);
  const best = [...solid].sort((a, b) => b.stars - a.stars)[0], cheap = [...solid].sort((a, b) => a.qm - b.qm)[0];
  const fsec = block(best && cheap ? `${best.name} hat die besten Wohnungen, ${cheap.name} die günstigsten pro m²` : "Gesellschaften",
    "Wie viele passende Angebote jede Gesellschaft hatte, wie gut und wie teuer sie im Schnitt waren und wie deine Anfragen dort liefen.");
  const firms = el("div", "firms");
  for (const c of cs) {
    const f = el("div", "firm");
    const n = el("div", "num"); n.append(document.createTextNode(String(c.a.length)), el("small", null, c.a.length === 1 ? "Angebot" : "Angebote"));
    const dl = el("dl");
    const row = (t, v, cls) => { dl.append(el("dt", null, t)); const d = el("dd", cls, v); dl.append(d); };
    row("Sterne", c.stars != null ? `${"★".repeat(Math.round(c.stars))} ${c.stars.toFixed(1).replace(".", ",")}` : "–", "stars");
    row("pro m²", c.qm != null ? `${num(c.qm, 1)} €` : "–");
    row("Anfragen", c.asked ? `${c.weiter} von ${c.asked} weiter` : "keine", c.weiter ? "best" : "");
    f.append(el("h5", null, c.name), n, dl);
    hover(f, () => [c.name, `${c.a.length} passende Angebote`, c.asked ? `${c.asked} angefragt, ${c.weiter} eine Runde weiter` : "noch nie angefragt"]);
    firms.append(f);
  }
  fsec.append(firms);
  wrap.append(fsec);

  // ---------- Preis gegen Größe
  const pts = items.filter(it => it.price && it.size && it.size < 120 && it.price < 1400);
  const qmAll = avg(pts.map(it => it.price / it.size));
  const sc = block(`Im Schnitt zahlst du ${num(qmAll, 1)} € warm pro m²`,
    "Jede Wohnung ein Punkt: rechts größer, oben teurer. Gestrichelt: 12, 15 und 18 € pro m². Weiß umrandet: angefragt.");
  sc.append(scatter(pts, isAsked));
  wrap.append(sc);

  // ---------- Wochen
  const weeks = new Map();
  const wkKey = d => { const t = new Date(d); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - (t.getDay() + 6) % 7); return t.getTime(); };
  for (let t = wkKey(first); t <= Date.now(); t += 7 * 864e5) weeks.set(wkKey(t), [0, 0]);
  for (const it of items) { const d = new Date(it.online_since); if (!isFinite(d)) continue; const w = weeks.get(wkKey(d)); if (w) w[isAsked(it) ? 1 : 0]++; }
  const wv = [...weeks.entries()];
  const wsec = block(`Jede Woche etwa ${Math.round(avg(wv.slice(0, -1).map(([, v]) => v[0] + v[1])) || 0)} passende Angebote`,
    "Höhe = passende Angebote der Woche, grüner Teil = angefragt. Die letzte Säule ist die laufende Woche.");
  wsec.append(weekBars(wv));
  wrap.append(wsec);

  wrap.append(el("p", "statfoot", "„Passend“ heißt: hat die Filter des Bots bestanden (Größe, Preis, Bezirk, kein WBS). Von Hand markierte Anfragen zählen nur auf diesem Gerät mit."));
}

function ringInside(c) {   // Punkt im Polygon des S-Bahn-Rings (wie rating.py, ohne Toleranz)
  let inside = false;
  for (let i = 0, j = RING.length - 1; i < RING.length; j = i++) {
    const [yi, xi] = RING[i], [yj, xj] = RING[j];
    if ((yi > c[0]) !== (yj > c[0]) && c[1] < xi + (c[0] - yi) * (xj - xi) / (yj - yi)) inside = !inside;
  }
  return inside;
}

function river(asked, outcome) {   // Sankey: Gesellschaft -> Ergebnis
  const W = 360, unit = Math.max(6, Math.min(12, 300 / Math.max(1, asked.length))), gap = 10, lx = 92, rx = W - 112, nw = 8;
  const left = {}, right = {}, link = {};
  for (const it of asked) {
    const c = COMPANY[it.company] || it.company || "?", o = outcome(it);
    left[c] = (left[c] || 0) + 1; right[o] = (right[o] || 0) + 1;
    link[c + "|" + o] = (link[c + "|" + o] || 0) + 1;
  }
  const L = Object.entries(left).sort((a, b) => b[1] - a[1]);
  const R = Object.keys(OUTCOME).filter(o => right[o]).map(o => [o, right[o]]);
  const hL = L.reduce((s, [, v]) => s + v * unit, 0) + gap * (L.length - 1);
  const hR = R.reduce((s, [, v]) => s + v * unit, 0) + gap * (R.length - 1);
  const H = Math.max(hL, hR) + 8;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "river", role: "img", "aria-label": "Was aus den Anfragen wurde" });
  const place = (arr, h) => { let y = (H - h) / 2; const pos = {}; for (const [n, v] of arr) { pos[n] = { y, h: v * unit, off: 0 }; y += v * unit + gap; } return pos; };
  const pl = place(L, hL), pr = place(R, hR);
  for (const [o] of R) for (const [c] of L) {   // Bänder, sortiert nach Ergebnis, damit sie sich wenig kreuzen
    const v = link[c + "|" + o]; if (!v) continue;
    const a = pl[c], b = pr[o], h = v * unit, y0 = a.y + a.off, y1 = b.y + b.off;
    a.off += h; b.off += h;
    const x0 = lx + nw, x1 = rx, mx = (x0 + x1) / 2;
    const band = svgEl("path", { d: `M${x0},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1} V${y1 + h} C${mx},${y1 + h} ${mx},${y0 + h} ${x0},${y0 + h} Z`,
      fill: OUTCOME[o].color, class: "band" }, svg);
    hover(band, () => [`${v} Anfrage${v === 1 ? "" : "n"}`, `${c} → ${OUTCOME[o].name}`]);
  }
  for (const [c, v] of L) {
    const p = pl[c];
    svgEl("rect", { x: lx, y: p.y, width: nw, height: p.h, rx: 2, fill: "var(--ni)" }, svg);
    const t = svgEl("text", { x: lx - 8, y: p.y + p.h / 2 + 4, "text-anchor": "end" }, svg); t.textContent = c;
    const n = svgEl("text", { x: lx - 8, y: p.y + p.h / 2 + 17, "text-anchor": "end", class: "sub" }, svg);
    if (p.h > 14) n.textContent = `${v}`;
  }
  for (const [o, v] of R) {
    const p = pr[o];
    svgEl("rect", { x: rx, y: p.y, width: nw, height: p.h, rx: 2, fill: OUTCOME[o].color }, svg);
    const t = svgEl("text", { x: rx + nw + 8, y: p.y + p.h / 2 - 2 }, svg); t.textContent = OUTCOME[o].name;
    const n = svgEl("text", { x: rx + nw + 8, y: p.y + p.h / 2 + 12, class: "sub" }, svg); n.textContent = `${v} Anfrage${v === 1 ? "" : "n"}`;
  }
  return svg;
}

function dotClock(cells) {   // Wochentag x Stunde, jeder Punkt eine Wohnung (bis 9 Punkte je Feld, darüber heller)
  const W = 360, lw = 26, top = 16, cw = (W - lw) / 16, ch = 24;
  const H = top + 7 * ch;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "clock", role: "img", "aria-label": "Wann neue Angebote kommen" });
  for (let j = 0; j < 16; j += 2) { const t = svgEl("text", { x: lw + j * cw + 2, y: 11 }, svg); t.textContent = `${6 + j}`; }
  const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  cells.forEach((r, i) => {
    const ty = svgEl("text", { x: 0, y: top + i * ch + ch / 2 + 4 }, svg); ty.textContent = WD[i];
    r.forEach((v, j) => {
      const g = svgEl("g", { class: "cell" }, svg);
      const x = lw + j * cw, y = top + i * ch;
      svgEl("rect", { x: x + 1, y: y + 1, width: cw - 2, height: ch - 2, rx: 3, class: "cellbg" }, g);
      const n = Math.min(9, v), d = 4.2, pad = (cw - 3 * d - 4) / 2;
      for (let q = 0; q < n; q++) {
        svgEl("circle", { cx: x + pad + d / 2 + (q % 3) * (d + 2), cy: y + (ch - 3 * d - 4) / 2 + d / 2 + Math.floor(q / 3) * (d + 2), r: d / 2,
          class: "dot", opacity: v > 9 ? 1 : 0.9 }, g);
      }
      hover(g, () => [`${v} Wohnung${v === 1 ? "" : "en"}`, `${["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"][i]}, ${6 + j}–${7 + j} Uhr`]);
    });
  });
  return svg;
}

function scatter(pts, isAsked) {
  const W = 360, H = 250, ml = 38, mb = 22, mt = 8, mr = 8;
  const x0 = 25, x1 = Math.max(75, Math.ceil(Math.max(0, ...pts.map(p => p.size)) / 5) * 5);
  const y0 = 300, y1 = Math.max(1000, Math.ceil(Math.max(0, ...pts.map(p => p.price)) / 100) * 100);
  const X = v => ml + (W - ml - mr) * (v - x0) / (x1 - x0), Y = v => H - mb - (H - mb - mt) * (v - y0) / (y1 - y0);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "plot", role: "img", "aria-label": "Preis gegen Größe" });
  for (let v = 400; v <= y1; v += 200) {
    svgEl("line", { x1: ml, x2: W - mr, y1: Y(v), y2: Y(v), class: "grid" }, svg);
    svgEl("text", { x: ml - 5, y: Y(v) + 4, "text-anchor": "end", class: "tick" }, svg).textContent = `${v} €`;
  }
  for (let v = 30; v <= x1; v += 10) svgEl("text", { x: X(v), y: H - 5, "text-anchor": "middle", class: "tick" }, svg).textContent = `${v} m²`;
  svgEl("line", { x1: ml, x2: W - mr, y1: H - mb, y2: H - mb, class: "axis" }, svg);
  for (const q of [12, 15, 18]) {
    const xa = Math.max(x0, y0 / q), xb = Math.min(x1, y1 / q);
    if (xb <= xa) continue;
    svgEl("line", { x1: X(xa), y1: Y(q * xa), x2: X(xb), y2: Y(q * xb), class: "ref" }, svg);
    svgEl("text", { x: X(xb) - 2, y: Y(q * xb) + (xb === x1 ? -5 : 12), "text-anchor": "end", class: "tick" }, svg).textContent = `${q} €/m²`;
  }
  for (const p of [...pts].sort((a, b) => isAsked(a) - isAsked(b))) {
    const a = isAsked(p);
    const g = svgEl("g", { class: "pt" }, svg);
    svgEl("circle", { cx: X(p.size), cy: Y(p.price), r: 12, fill: "transparent" }, g);
    svgEl("circle", { cx: X(p.size), cy: Y(p.price), r: a ? 4.6 : 3.2, fill: "var(--amber)", "fill-opacity": a ? 1 : 0.7,
      stroke: a ? "#fff" : "none", "stroke-width": 1.6 }, g);
    hover(g, () => [`${num(p.price)} € warm, ${num(p.size)} m²`, `${p.bezirk || ""}, ${COMPANY[p.company] || p.company || ""}`,
      `${"★".repeat(p.stars || 0)} ${num(p.price / p.size, 1)} €/m²${a ? ", angefragt" : ""}`]);
  }
  return svg;
}

function weekBars(wv) {
  const W = 360, H = 160, wb = 20, wt = 16;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "plot", role: "img", "aria-label": "Angebote pro Woche" });
  const max = Math.max(1, ...wv.map(([, v]) => v[0] + v[1]));
  const step = W / Math.max(1, wv.length), bw = Math.min(30, step * 0.6);
  wv.forEach(([t, [rest, ak]], i) => {
    const x = i * step + (step - bw) / 2, hT = (H - wb - wt) * (rest + ak) / max, hA = (H - wb - wt) * ak / max;
    const g = svgEl("g", { class: "col" }, svg);
    svgEl("rect", { x: x - 3, y: wt - 6, width: bw + 6, height: H - wb - wt + 6, fill: "transparent" }, g);
    if (hT > 0) svgEl("path", { d: roundTop(x, H - wb, bw, hT), fill: "var(--amber)", "fill-opacity": 0.55 }, g);
    if (hA > 0) svgEl("rect", { x, y: H - wb - hA, width: bw, height: hA, fill: "var(--sgreen)" }, g);
    if (hA > 0 && hT - hA > 2) svgEl("line", { x1: x, x2: x + bw, y1: H - wb - hA, y2: H - wb - hA, stroke: "var(--nb)", "stroke-width": 2 }, g);
    svgEl("text", { x: x + bw / 2, y: H - wb - hT - 5, "text-anchor": "middle", class: "val" }, g).textContent = rest + ak;
    const d = new Date(t);
    if (wv.length <= 8 || i % 2 === 0) svgEl("text", { x: x + bw / 2, y: H - 5, "text-anchor": "middle", class: "tick" }, svg).textContent = `${d.getDate()}.${d.getMonth() + 1}.`;
    hover(g, () => [`${rest + ak} passende Angebote`, `Woche ab ${d.toLocaleDateString("de-DE")}`, `${ak} angefragt`]);
  });
  svgEl("line", { x1: 0, x2: W, y1: H - wb, y2: H - wb, class: "axis" }, svg);
  return svg;
}
function roundTop(x, base, w, h) {
  const r = Math.min(4, h, w / 2), y = base - h;
  return `M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${base} Z`;
}

// ---- Netzdiagramm: die Einzelpunkte der Bewertung, zu sechs Bereichen zusammengefasst.
// Reihenfolge im Uhrzeigersinn ab oben: Wohnung (rechts), Lage (links).
// Statt "Kosten" (der Preis steht schon daneben) zählt hier der Preis pro m²: 10 € = voll, 20 € = leer.
const AXES = [
  ["€/m²", null],
  ["Größe", ["Größe", "Zimmer"]],
  ["Haus", ["Baujahr", "Hochhaus", "Aufzug", "Außenbereich"]],
  ["Arbeit", ["Lage"]],
  ["Zentrum", ["Zentrum", "Ringbahn", "ÖPNV"]],
  ["Kiez", ["Kiez", "Bezirk"]],
];
const clamp01 = x => Math.max(0, Math.min(1, x));
function axisScores(o) {
  const parts = o.parts || {};
  return AXES.map(([name, keys]) => {
    if (!keys) {
      const sqm = o.price && o.size ? o.price / o.size : null;
      return { name, v: sqm ? clamp01((20 - sqm) / 10) : null,
               label: sqm ? sqm.toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " €" : "–" };
    }
    let got = 0, max = 0;
    for (const k of keys) if (parts[k]) { got += +parts[k][0] || 0; max += +parts[k][1] || 0; }
    const v = max ? clamp01(got / max) : null;
    return { name, v, label: v == null ? "–" : Math.round(v * 100) + " %" };
  });
}
// Farbe nach Gesamtbewertung: grau (schwach) über gelb zu grün, 5 Sterne lila
function radarColor(o) {
  if ((o.stars || 0) >= 5) return "#a97df5";
  const stops = [[45, [138, 134, 126]], [64, [222, 182, 58]], [80, [122, 196, 104]]];
  const p = o.points == null ? 55 : o.points;
  if (p <= stops[0][0]) return `rgb(${stops[0][1]})`;
  for (let i = 1; i < stops.length; i++) {
    const [p1, c1] = stops[i - 1], [p2, c2] = stops[i];
    if (p <= p2) { const t = (p - p1) / (p2 - p1); return `rgb(${c1.map((c, j) => Math.round(c + t * (c2[j] - c)))})`; }
  }
  return `rgb(${stops[stops.length - 1][1]})`;
}
const sv = svgEl;
let radarId = 0;
function radar(o, big) {
  const sc = axisScores(o);
  if (sc.every(a => a.v == null)) return null;
  const R = big ? 78 : 36, pad = big ? 46 : 30, W = 2 * (R + pad), H = 2 * R + (big ? 64 : 40);
  const cx = W / 2, cy = H / 2, color = radarColor(o);
  const svg = sv("svg", { class: "radar" + (big ? " big" : ""), viewBox: `0 0 ${W} ${H}`, role: "img" });
  svg.style.setProperty("--rc", color);
  svg.setAttribute("aria-label", sc.map(a => `${a.name} ${a.label}`).join(", "));
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / sc.length;
  const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  for (const f of [1 / 3, 2 / 3, 1])
    sv("polygon", { class: "web" + (f === 1 ? " outer" : ""), points: sc.map((_, i) => pt(i, R * f).join(",")).join(" ") }, svg);
  sc.forEach((_, i) => { const [x, y] = pt(i, R); sv("line", { class: "web", x1: cx, y1: cy, x2: x, y2: y }, svg); });
  const shape = sc.map((a, i) => pt(i, R * Math.max(0.06, a.v == null ? 0.5 : a.v)));
  const points = shape.map(p => p.join(",")).join(" ");
  // Halbton-Füllung: Punkte auf schrägem Raster, zur Mitte hin größer und kräftiger
  const id = "rclip" + (++radarId);
  sv("polygon", { points }, sv("clipPath", { id }, sv("defs", {}, svg)));
  const dots = sv("g", { "clip-path": `url(#${id})`, class: "dots" }, svg);
  const step = big ? 4.2 : 3.3, k = Math.SQRT1_2;
  for (let u = -R; u <= R; u += step) for (let w = -R; w <= R; w += step) {
    const x = (u - w) * k, y = (u + w) * k, d = Math.hypot(x, y) / R;
    if (d > 1) continue;
    sv("circle", { cx: (cx + x).toFixed(1), cy: (cy + y).toFixed(1), r: (step * (0.42 - 0.26 * d)).toFixed(2),
                   "fill-opacity": (0.95 - 0.45 * d).toFixed(2) }, dots);
  }
  sv("polygon", { class: "shape", points }, svg);
  if (big) shape.forEach(([x, y]) => sv("circle", { class: "tip-dot", cx: x, cy: y, r: 2.4 }, svg));
  sc.forEach((a, i) => {
    const [x, y] = pt(i, R + (big ? 14 : 8));
    const c = Math.cos(ang(i));
    const anchor = Math.abs(c) < 0.2 ? "middle" : c > 0 ? "start" : "end";
    const dy = Math.sin(ang(i)) < -0.5 ? -2 : Math.sin(ang(i)) > 0.5 ? (big ? 10 : 8) : 3;
    const t = sv("text", { x, y: y + dy, "text-anchor": anchor }, svg);
    t.textContent = a.name;
    if (big) sv("text", { class: "v", x, y: y + dy + 13, "text-anchor": anchor }, svg).textContent = a.label;
  });
  return svg;
}

function makeCard(key, o) {
    const card = el("article", "card");
    const tap = el("button", "tap");
    const imgs = (o.images || []).map(imgUrl).filter(Boolean);
    const pics = el("div", "pics");
    const plans = (o.plans || []).map(imgUrl).filter(Boolean);
    const strip = el("div", "strip" + (plans.length ? " withplan" : imgs.length === 1 ? " one" : ""));
    // Links der Grundriss (in Gold auf Schwarz umgefärbt), daneben die Fotos zum Weiterwischen
    if (plans.length) {
      const tile = el("div", "plantile"), i = el("img");
      i.loading = "lazy"; i.alt = "Grundriss"; i.referrerPolicy = "no-referrer"; i.src = plans[0];
      i.addEventListener("error", () => tile.remove());
      i.addEventListener("click", ev => { ev.stopPropagation(); openViewer(plans, 0); });
      tile.append(i);
      strip.append(tile);
    }
    for (const src of imgs) {
      const i = el("img");
      i.loading = "lazy"; i.alt = ""; i.referrerPolicy = "no-referrer"; i.src = src;
      i.addEventListener("error", () => i.remove());
      i.addEventListener("click", ev => { ev.stopPropagation(); viewFrom(strip, i); });
      strip.append(i);
    }
    if (!imgs.length && !plans.length) strip.append(el("span", "none", "kein Bild"));
    strip.addEventListener("click", () => openDetail(key));
    pics.append(strip);
    if (imgs.length > 1) pics.append(el("span", "count", `${imgs.length} Bilder`));
    const info = el("div", "info");
    const stars = el("div", "stars", "★".repeat(o.stars || 0) + "☆".repeat(5 - (o.stars || 0)));
    if (o.points != null) stars.append(el("small", null, `${o.points} Punkte`));
    const v = viewing(o);
    if (v) stars.append(el("span", "badge " + v.cls, v.text));
    info.append(stars,
      mainLine(o),
      place(o),
      o.gone ? el("div", "sub gone", `${COMPANY[o.company] || o.company || ""} · nicht mehr online`)
             : el("div", "sub", `${COMPANY[o.company] || o.company || ""} · online ${ago(o.online_since).replace("vor ", "seit ")}`));
    tap.append(info);
    const r = radar(o);
    if (r) tap.append(r);
    tap.append(routeLine(key, o));   // volle Breite unter Text und Netzdiagramm
    tap.addEventListener("click", () => openDetail(key));

    return card;
}

  body.append(el("h3", null, "Eckdaten"));
  const t = el("table");

  row(t, "Wohnfläche", o.size != null ? `${num(o.size, 1)} m²` : null);

  row(t, "Kaltmiete", o.cold != null ? `${num(o.cold, 2)} €` : null);
  row(t, "Etage", o.floor == null ? null : (o.floor === 0 ? "EG" : `${o.floor}.`) + (o.levels ? ` von ${o.levels}` : ""));
  row(t, "Baujahr", o.year != null ? String(o.year) : null);
  row(t, "Gesellschaft", COMPANY[o.company] || o.company);
  row(t, "Online seit", o.online_since ? new Date(o.online_since).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : null);
  if (o.requested_at) row(t, "Anfrage raus", new Date(o.requested_at).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }));
  body.append(t);

  if ((o.mails || []).length) {
    body.append(el("h3", null, "Mails dazu"));
    for (const m of [...o.mails].reverse()) body.append(mailRow(m));
  }

  body.append(el("h3", null, "Lage"));
  const mapBox = el("div"), dist = el("div", "dist");
  mapBox.id = "map";
  const edit = el("button", "places-btn", "Eigene Orte ändern");
  edit.addEventListener("click", editPlaces);
  body.append(mapBox, dist, routeLine(openKey, o, true), edit);
  if (isMine(openKey, o)) {
    const drop = el("button", "places-btn", dropped[openKey] ? "Doch wieder verfolgen" : "Nicht weiter verfolgen");
    drop.style.marginLeft = "8px";
    drop.addEventListener("click", () => toggleDropped(openKey));
    body.append(drop);
  }
  requestAnimationFrame(() => showMap(o, mapBox, dist));

  if (o.parts && Object.keys(o.parts).length) {
    body.append(el("h3", null, "So kommen die Sterne zustande"));
    const big = radar(o, true);
    if (big) { const box = el("div", "radar-box"); box.append(big); body.append(box); }
    for (const [name, [got, max]] of Object.entries(o.parts).sort((a, b) => b[1][1] - a[1][1])) {
      const p = el("div", "part");
      const track = el("div", "track"), fill = el("div", "fill");
      fill.style.width = `${max ? Math.round(100 * got / max) : 0}%`;
      track.append(fill);
      p.append(el("span", null, name), track, el("span", null, `${num(got)} / ${max}`));
      body.append(p);
    }
  }
  if (o.text) body.append(el("h3", null, "Beschreibung"), el("div", "text", o.text));

  const foot = el("div", "foot"), inner = el("div", "in");
  const url = safeUrl(o.url);
  if (o.gone) {
    inner.append(el("span", "link off", "Nicht mehr online"));
  } else if (url && !state(openKey, o).url) {  // sonst öffnet schon der Anfrage-Knopf die Seite
    const a = el("a", "link", "Zur Anzeige");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    inner.append(a);
  }
  inner.append(reqButton(openKey, o));
  foot.append(inner);
  sheet.append(close, gallery, body, foot);
  dlg.replaceChildren(sheet);
}

// ---- Mails: der Bot legt sie verschlüsselt ab (die Seite ist öffentlich). Den Schlüssel kennt nur dieses
// Gerät (einmal eingeben oder per Link #mailkey=...); er passt zum GitHub-Secret MAIL_VIEW_KEY.
const MAIL_KIND = { selbstauskunft: "Selbstauskunft nötig", absage: "Absage", einladung: "Einladung", eingang: "Eingangsbestätigung",
                    formular: "Formular nötig", antwort: "Antwort" };
const openMails = new Set(), mailCache = new Map();
let mailKeyPromise = null;
const getMailPass = () => { try { return localStorage.getItem("mailkey") || ""; } catch (e) { return ""; } };
function setMailPass(v) { mailKeyPromise = null; try { v ? localStorage.setItem("mailkey", v) : localStorage.removeItem("mailkey"); } catch (e) {} }
function mailKey(pass) {
  if (!mailKeyPromise) mailKeyPromise = crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
    .then(base => crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: new TextEncoder().encode("wohnungsbot-mails-v1"), iterations: 200000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]));
  return mailKeyPromise;
}
async function unseal(box) {
  if (mailCache.has(box)) return mailCache.get(box);
  const raw = Uint8Array.from(atob(box), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, await mailKey(getMailPass()), raw.slice(12));
  const v = JSON.parse(new TextDecoder().decode(plain));
  mailCache.set(box, v);
  return v;
}
function mailRow(m) {
  const wrap = el("div", "mail"), head = el("button");
  const when = m.at ? new Date(m.at).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "";
  head.append(el("span", "kind " + (m.kind || ""), MAIL_KIND[m.kind] || "Mail"), el("span", "meta", `${m.from || ""} · ${when}`));
  const box = el("div", "open");
  const show = async () => {
    if (!getMailPass()) {
      const k = prompt("Schlüssel für die Mails (einmal auf diesem Gerät eingeben):");
      if (!k) return;
      setMailPass(k.trim());
    }
    try {
      const v = await unseal(m.box);
      box.replaceChildren(el("b", null, v.subject || ""), document.createTextNode(v.text || ""));
    } catch (e) {
      setMailPass("");
      box.replaceChildren(document.createTextNode("Der Schlüssel passt nicht. Nochmal antippen und neu eingeben."));
    }
    if (!box.isConnected) wrap.append(box);
  };
  head.addEventListener("click", () => {
    if (openMails.has(m.id)) { openMails.delete(m.id); box.remove(); }
    else { openMails.add(m.id); show(); }
  });
  wrap.append(head);
  if (openMails.has(m.id)) show();
  return wrap;
}

// ---- Fotos in voller Größe: antippen, dann wischen
function viewFrom(container, img) {
  const srcs = [...container.querySelectorAll("img")].map(x => x.src);
  openViewer(srcs, Math.max(0, srcs.indexOf(img.src)));
}
function openViewer(srcs, start) {
  const dlg = document.getElementById("viewer");
  const frames = el("div", "frames"), pos = el("div", "pos");
  for (const src of srcs) {
    const i = el("img");
    i.alt = ""; i.referrerPolicy = "no-referrer"; i.src = src;
    frames.append(i);
  }
  const close = el("button", "close", "✕");
  close.setAttribute("aria-label", "Schließen");
  close.addEventListener("click", () => dlg.close());
  const update = () => { pos.textContent = `${Math.round(frames.scrollLeft / (frames.clientWidth || 1)) + 1} / ${srcs.length}`; };
  frames.addEventListener("scroll", update, { passive: true });
  dlg.replaceChildren(frames, close, pos);
  if (!dlg.open) { dlg.showModal(); history.pushState({ layer: "viewer" }, ""); }
  frames.scrollLeft = start * frames.clientWidth;
  update();
}

// ---- Karte: Wohnung und eigene Orte. Die eigenen Orte (z.B. Zuhause) stehen nur auf diesem Gerät,
// nie in der öffentlichen Seite. Einrichten über "Eigene Orte ändern" oder einen Link mit #orte=...
const LEAFLET = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
const DEFAULT_PLACES = [{ name: "Arbeit neu", q: "Engelbecken, Berlin", lat: 52.5049, lon: 13.4163, color: "#2f6fde" }];
const PLACE_COLORS = ["#2f6fde", "#7a4cc2", "#1f8f4e", "#c46a00"];
let leafletLoad = null;
function leaflet() {
  if (!leafletLoad) leafletLoad = new Promise(resolve => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = LEAFLET + "leaflet.css";
    document.head.append(css);
    const js = document.createElement("script");
    js.src = LEAFLET + "leaflet.js";
    js.onload = () => resolve(window.L || null);
    js.onerror = () => { leafletLoad = null; resolve(null); };
    document.head.append(js);
  });
  return leafletLoad;
}
let lastLookup = 0;
async function geocode(q) {
  const key = "geo:" + q;
  try { const c = localStorage.getItem(key); if (c) return JSON.parse(c); } catch (e) {}
  const wait = lastLookup + 1100 - Date.now();   // Nominatim: höchstens eine Anfrage pro Sekunde
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastLookup = Date.now();
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=" + encodeURIComponent(q));
    const d = await r.json();
    const v = d && d[0] ? [+d[0].lat, +d[0].lon] : null;
    if (v) try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
    return v;
  } catch (e) { return null; }
}
async function offerCoord(o) {
  if (Array.isArray(o.coord) && o.coord.length === 2 && o.coord.every(isFinite)) return o.coord.map(Number);
  return o.address ? geocode(o.address) : null;
}
function places() {
  try { const p = JSON.parse(localStorage.getItem("places") || "null"); if (Array.isArray(p)) return p; } catch (e) {}
  return DEFAULT_PLACES;
}
async function setPlaces(text) {   // "Zuhause: Straße 1, 10437; Arbeit: ..."
  const out = [];
  for (const part of text.split(";").map(x => x.trim()).filter(Boolean)) {
    const m = part.match(/^([^:]{1,30}):\s*(.+)$/);
    const name = (m ? m[1] : part).trim(), q = (m ? m[2] : part).trim();
    const c = await geocode(/berlin/i.test(q) ? q : q + ", Berlin");
    if (c) out.push({ name, q, lat: c[0], lon: c[1], color: PLACE_COLORS[out.length % PLACE_COLORS.length] });
  }
  try { localStorage.setItem("places", JSON.stringify(out)); } catch (e) {}
  return out;
}
async function editPlaces() {
  const now = places().map(p => `${p.name}: ${p.q || ""}`).join("; ");
  const t = prompt("Eigene Orte für die Karte (Name: Adresse), getrennt mit Semikolon:", now);
  if (t === null) return;
  await setPlaces(t);
  if (openKey) drawDetail();
}
// ---- Fahrt zur Arbeit mit Bus und Bahn (VBB-Fahrplan über v6.vbb.transport.rest, direkt vom Handy).
// Ziele sind die eigenen Orte mit "Arbeit" im Namen (stehen nur auf dem Gerät). Abfahrt: nächster Werktag 8 Uhr.
// Ergebnis bleibt im localStorage, damit jede Strecke nur einmal gefragt wird.
function routeTargets() {
  const p = places(), w = p.filter(x => /arbeit|job|büro/i.test(x.name));
  return (w.length ? w : p).slice(0, 2);
}
function nextWorkday8() {
  const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d.toISOString();
}
let routeQueue = Promise.resolve();
function fetchRoute(from, to) {
  const key = "route:" + from.map(x => x.toFixed(4)).join(",") + "|" + to.map(x => x.toFixed(4)).join(",");
  try { const c = localStorage.getItem(key); if (c) return Promise.resolve(JSON.parse(c)); } catch (e) {}
  const job = routeQueue.then(async () => {
    const q = new URLSearchParams({ "from.type": "location", "from.latitude": from[0], "from.longitude": from[1], "from.address": "Wohnung",
      "to.type": "location", "to.latitude": to[0], "to.longitude": to[1], "to.address": "Ziel",
      departure: nextWorkday8(), results: 3, stopovers: "false", remarks: "false", polylines: "false", language: "de" });
    try {
      const r = await fetch("https://v6.vbb.transport.rest/journeys?" + q);
      if (!r.ok) return null;
      const js = ((await r.json()).journeys || []);
      let best = null;
      for (const j of js) {
        const legs = j.legs || [];
        if (!legs.length) continue;
        const min = Math.round((new Date(legs[legs.length - 1].arrival) - new Date(legs[0].departure)) / 60000);
        const lines = legs.filter(l => l.line).map(l => ({ n: l.line.name, p: l.line.product }));
        if (!best || min < best.min) best = { min, lines };
      }
      if (best) try { localStorage.setItem(key, JSON.stringify(best)); } catch (e) {}
      return best;
    } catch (e) { return null; }
    finally { await new Promise(r => setTimeout(r, 700)); }   // höchstens ~1 Anfrage pro Sekunde
  });
  routeQueue = job.catch(() => null);
  return job;
}
const PROD = { suburban: "S", subway: "U", tram: "T", bus: "B", regional: "R", express: "R", ferry: "B" };
const routeSeen = typeof IntersectionObserver === "function" ? new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) { routeSeen.unobserve(e.target); e.target._go(); }
}, { rootMargin: "300px" }) : null;
function routeLine(key, o, big) {
  const box = el("div", "route" + (big ? " big" : ""));
  const targets = routeTargets();
  if (!targets.length) return box;
  box._go = async () => {
    const from = await offerCoord(o);
    if (!from) return;
    for (const t of targets) {
      const r = await fetchRoute(from, [t.lat, t.lon]);
      if (!r || !box.isConnected) continue;
      const span = el("span", "r");
      span.append(el("span", null, t.name), el("b", null, `${r.min} Min`));
      if (!r.lines.length) span.append(el("span", null, "zu Fuß"));
      r.lines.forEach((l, i) => {
        if (i) span.append(el("span", "ar", "›"));
        span.append(el("span", "ln " + (PROD[l.p] || ""), l.n));
      });
      box.append(span);
    }
  };
  if (routeSeen) routeSeen.observe(box); else setTimeout(box._go, 0);
  return box;
}
function km(a, b) {
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
async function showMap(o, box, dist) {
  const where = await offerCoord(o);
  if (!box.isConnected) return;
  if (!where) { box.style.height = "auto"; box.replaceChildren(el("div", "dist", "Adresse nicht auf der Karte gefunden.")); return; }
  const L = await leaflet();
  if (!box.isConnected) return;
  if (!L) { box.style.height = "auto"; box.replaceChildren(el("div", "dist", "Karte konnte nicht geladen werden.")); return; }
  // Auf dem Handy scrollt ein Finger die Seite, zwei Finger verschieben und zoomen die Karte
  const map = L.map(box, { scrollWheelZoom: false, dragging: !L.Browser.mobile, tap: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
              { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  const label = (m, text) => m.bindTooltip(text, { permanent: true, direction: "top", offset: [0, -8] });
  label(L.circleMarker(where, { radius: 10, color: "#fff", weight: 3, fillColor: "#d93a2b", fillOpacity: 1 }).addTo(map), "Wohnung");
  const pts = [where], parts = [];
  for (const p of places()) {
    const at = [p.lat, p.lon];
    label(L.circleMarker(at, { radius: 7, color: "#fff", weight: 2, fillColor: p.color || "#2f6fde", fillOpacity: 1 }).addTo(map), p.name);
    pts.push(at);
    parts.push(`${p.name} ${km(where, at).toLocaleString("de-DE", { maximumFractionDigits: 1 })} km`);
  }
  map.fitBounds(pts, { padding: [36, 36], maxZoom: 15 });
  dist.textContent = parts.length ? "Luftlinie: " + parts.join(" · ") : "";
}

function openDetail(key) {
  openKey = key;
  drawDetail();
  const dlg = document.getElementById("detail");
  if (!dlg.open) { dlg.showModal(); history.pushState({ layer: "detail" }, ""); }
  dlg.scrollTop = 0;
}
document.getElementById("detail").addEventListener("close", () => { openKey = null; });
// Zurück-Taste/-Geste des Handys schließt Bildbetrachter bzw. Anzeige statt die Seite zu verlassen:
// beim Öffnen gibt es einen Eintrag im Verlauf, "Zurück" nimmt ihn wieder weg.
window.addEventListener("popstate", () => {
  const layer = history.state && history.state.layer;
  const viewer = document.getElementById("viewer"), detail = document.getElementById("detail");
  if (layer !== "viewer" && viewer.open) viewer.close();
  if (!layer && detail.open) detail.close();
});
// Mit ✕ geschlossen: den eigenen Verlaufseintrag wieder entfernen
for (const [id, layer] of [["viewer", "viewer"], ["detail", "detail"]]) {
  document.getElementById(id).addEventListener("close", () => {
    if (history.state && history.state.layer === layer) history.back();
  });
}

async function refresh() {
  try {
    const r = await fetch("offers.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    offers = data.offers || {};
    updated = data.updated || null;
    lastAuto = data.last_auto || null;
    lastManual = data.last_manual || null;
    // Neue Daten nach dem Start von hier: Lauf ist durch
    if (startedAt && updated && new Date(updated).getTime() > startedAt) startedAt = 0;
  } catch (e) {
    document.getElementById("status").textContent = "Liste konnte nicht geladen werden.";
  }
  render();
}

document.querySelectorAll("[data-min]").forEach(b => b.addEventListener("click", () => { minStars = +b.dataset.min; render(); }));

}));
document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {

}));
// ---- Bot von der App aus starten (GitHub "workflow_dispatch")
function getToken() { try { return localStorage.getItem("gh_token") || ""; } catch (e) { return ""; } }
function setToken(t) { try { t ? localStorage.setItem("gh_token", t) : localStorage.removeItem("gh_token"); } catch (e) {} }
const tokenDlg = document.getElementById("token"), tokenMsg = document.getElementById("token-msg");

async function startBot() {
  const token = getToken();
  if (!token) { tokenMsg.textContent = ""; tokenDlg.showModal(); return; }
  const run = document.getElementById("run");
  run.disabled = true; run.textContent = "startet …";
  let res = null;
  try {
    res = await fetch(DISPATCH, {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28" },
      body: JSON.stringify({ ref: "main", inputs: { source: "app" } }),
    });
  } catch (e) { /* kein Netz */ }
  if (res && res.status === 204) {
    startedAt = Date.now();
    render();
    setTimeout(refresh, 100e3);
    setTimeout(refresh, 150e3);
    return;
  }
  render();
  if (res && [401, 403, 404].includes(res.status)) {
    setToken("");
    tokenMsg.textContent = `GitHub hat den Token abgelehnt (${res.status}). Bitte neu eingeben.`;
    tokenDlg.showModal();
  } else {
    document.getElementById("status").textContent = "Start hat nicht geklappt" + (res ? ` (${res.status})` : " (kein Netz)") + ".";
  }
}
document.getElementById("run").addEventListener("click", startBot);
document.getElementById("token-cancel").addEventListener("click", () => tokenDlg.close());
document.getElementById("token-save").addEventListener("click", () => {
  const t = document.getElementById("token-input").value.trim();
  if (!t) { tokenMsg.textContent = "Bitte den Token einfügen."; return; }
  setToken(t);
  document.getElementById("token-input").value = "";
  tokenDlg.close();
  startBot();
});

refresh();
setInterval(refresh, 120e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
