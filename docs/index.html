<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Wohnungen</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --ink: #1c1d21; --muted: #6b6e76; --line: #e3e1da;
    --star: #c98a00; --chip: #eeece6;
    --sent: #1f8f4e; --sent-ink: #ffffff;
    --idle: #d9d8d3; --idle-ink: #3b3d44;
    --late: #dcc3be; --late-ink: #5a2f29;
    --viz: #2a78d6; --viz-track: #e6e4dd;
    --s1: #86b6ef; --s2: #5598e7; --s3: #2a78d6; --s4: #1c5cab; --s5: #104281;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1e2127; --ink: #eceae4; --muted: #9a9da6; --line: #2d3139;
      --star: #f0b429; --chip: #2a2e36;
      --sent: #2aa55d; --sent-ink: #06170d;
      --idle: #3a3e47; --idle-ink: #d5d6da;
      --late: #5b3f3c; --late-ink: #f1d3ce;
      --viz: #3987e5; --viz-track: #2d3139;
      --s1: #184f95; --s2: #256abf; --s3: #3987e5; --s4: #6da7ec; --s5: #b7d3f6;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 16px 10px;
           padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; }
  #status { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #status.stale { color: var(--late-ink); background: var(--late); display: inline-block;
                  padding: 2px 8px; border-radius: 8px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { flex: 1; }
  #run { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 14px; font-size: 14px;
         font-weight: 600; white-space: nowrap; }
  #run:disabled { background: var(--chip); color: var(--muted); }
  #runs { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #runs.never { color: var(--late-ink); }
  #token { width: min(92vw, 420px); height: fit-content; border-radius: 16px; padding: 18px; margin: auto;
           border: 1px solid var(--line); }
  #token h2 { margin: 0 0 8px; font-size: 18px; }
  #token p { color: var(--muted); font-size: 14px; margin: 6px 0; }
  #token input { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--line); margin: 10px 0;
                 background: var(--card); color: var(--ink); font: inherit; }
  #token .row { display: flex; gap: 8px; }
  #token .row button { flex: 1; padding: 11px; border-radius: 10px; background: var(--chip); font-weight: 600; }
  #token .row .ok { background: var(--ink); color: var(--bg); }
  #token a { color: inherit; }
  .bar { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .seg { background: var(--chip); border-radius: 999px; padding: 7px 13px; font-size: 14px; }
  .seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .gap { flex: 1; }
  .tabs { margin-top: 8px; }
  .tabs .seg { font-weight: 600; }
  .section { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 2px 8px; }
  .badge { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 650;
           margin-left: 8px; letter-spacing: 0; vertical-align: 1px; background: var(--sent); color: var(--sent-ink); }
  .badge.soon { background: var(--star); color: #1c1300; }
  main { padding: 12px 16px 40px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 14px; margin-bottom: 12px; overflow: hidden;
          border: 1px solid var(--line); }
  .card .tap { display: flex; gap: 12px; padding: 12px; width: 100%; text-align: left; background: none; }
  /* Alle Fotos direkt in der Liste: zum Wischen */
  .strip { display: flex; gap: 3px; overflow-x: auto; scroll-snap-type: x mandatory; height: 200px;
           background: var(--chip); scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip img { height: 100%; width: 82%; flex: none; object-fit: cover; scroll-snap-align: start; display: block; }
  .strip.one img { width: 100%; }
  .strip .none { margin: auto; color: var(--muted); font-size: 13px; }
  .count { position: absolute; right: 8px; top: 8px; background: rgba(0, 0, 0, .55); color: #fff;
           font-size: 12px; padding: 2px 7px; border-radius: 10px; pointer-events: none; }
  .pics { position: relative; }
  .bez { color: var(--ink); font-weight: 600; }
  .info { min-width: 0; flex: 1; }
  .stars { color: var(--star); letter-spacing: 1px; font-size: 15px; }
  .stars small { color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .main-line { font-weight: 650; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req { display: block; width: calc(100% - 24px); margin: 0 12px 12px; padding: 11px 12px; border-radius: 10px;
         font-weight: 600; font-size: 15px; background: var(--idle); color: var(--idle-ink); }
  .req.late { background: var(--late); color: var(--late-ink); }
  a.req { text-align: center; text-decoration: none; box-sizing: border-box; }
  .req.go { background: var(--ink); color: var(--bg); }
  .req.ask { background: var(--star); color: #1c1300; }
  .req.sent { background: var(--sent); color: var(--sent-ink); }
  .req.invite { background: var(--star); color: #1c1300; }
  .req.declined { background: var(--idle); color: var(--muted); }
  .req small { font-weight: 400; opacity: .85; margin-left: 6px; }
  .gone { color: var(--late-ink); }
  .link.off { background: var(--chip); color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 48px 12px; }

  dialog { border: 0; padding: 0; margin: 0; width: 100%; max-width: 100%; height: 100%; max-height: 100%;
           background: var(--bg); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  .sheet { max-width: 720px; margin: 0 auto; padding-bottom: 110px; }
  .close { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 3; width: 40px;
           height: 40px; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; font-size: 20px; }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: var(--chip);
             min-height: 120px; }
  .gallery img { width: 100%; flex: none; scroll-snap-align: center; aspect-ratio: 4 / 3; object-fit: cover;
                 display: block; }
  .gallery.many img { width: 88%; margin-right: 4px; }
  .body { padding: 14px 16px; }
  .body h2 { font-size: 19px; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .chip { background: var(--chip); border-radius: 8px; padding: 5px 9px; font-size: 14px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:last-child { text-align: right; }
  .part { display: grid; grid-template-columns: 108px 1fr 54px; gap: 8px; align-items: center;
          font-size: 14px; margin: 5px 0; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .fill { height: 100%; background: var(--star); border-radius: 4px; }
  .part span:last-child { text-align: right; color: var(--muted); }
  .text { white-space: pre-line; overflow-wrap: anywhere; }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
          padding: 10px 16px max(10px, env(safe-area-inset-bottom)); }
  .foot .in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  .foot .req { margin: 0; width: auto; flex: 1; }
  /* Fotos in voller Größe zum Durchwischen */
  dialog.viewer { background: #000; color: #fff; }
  .viewer .frames { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .viewer .frames::-webkit-scrollbar { display: none; }
  .viewer .frames img { flex: none; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
  .viewer .pos { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); text-align: center;
                 font-size: 14px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .strip img, .gallery img { cursor: zoom-in; }
  /* Karte in der Anzeige */
  #map { height: 280px; border-radius: 12px; background: var(--chip); z-index: 0; }
  .dist { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .places-btn { background: var(--chip); border-radius: 8px; padding: 6px 10px; font-size: 14px; margin-top: 8px; }
  /* Grundriss in der Anzeige: ganz zeigen, weißer Grund (oft GIF/PNG mit Transparenz) */
  .plans img { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: #fff;
               border-radius: 10px; margin-bottom: 8px; cursor: zoom-in; }
  .badge.plan { background: var(--chip); color: var(--ink); }
  /* Statistik: "Nachtplan" – Berlin bei Nacht. Natriumdampf-Laternen (Bernstein) für Wohnungen,
     S-Bahn-Grün für den Ring und alles, was eine Runde weiter kam. Immer dunkel, egal welches Handy-Thema. */
  body.night { background: #0d1422; }
  body.night main { max-width: 760px; }
  body.night header { background: #0d1422; color: #e9edf4; border-bottom-color: #24304a; }
  body.night #status, body.night #runs { color: #8c97ac; }
  body.night .seg { background: #1b2538; color: #c9d1de; }
  body.night .seg[aria-pressed="true"] { background: #e9edf4; color: #0d1422; }
  body.night #run { background: #e9edf4; color: #0d1422; }
  .stats { --nb: #0d1422; --np: #141d2e; --nl: #24304a; --ni: #e9edf4; --nm: #8c97ac; --amber: #ffb547;
           --sgreen: #00a65a; --slate: #56627a; --slate2: #3a4660;
           color: var(--ni); font-family: "Barlow", system-ui, sans-serif; display: grid; gap: 34px; padding-bottom: 20px; }
  .stats h4, .stats .lede, .stats .num { font-family: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; }
  .stats h4 { margin: 0 0 4px; font-size: 22px; line-height: 1.15; font-weight: 600; letter-spacing: -.005em; max-width: 30ch; }
  .stats .how { color: var(--nm); font-size: 13.5px; line-height: 1.45; margin: 0 0 12px; max-width: 58ch; }
  .lede { margin: 6px 0 0; display: grid; gap: 2px; }
  .lede p { margin: 0; font-size: 21px; line-height: 1.18; font-weight: 500; color: var(--nm); }
  .lede .num { font-size: 50px; line-height: .95; font-weight: 700; color: var(--ni); letter-spacing: -.02em;
               font-variant-numeric: tabular-nums; margin-right: 6px; }
  .lede p.go .num { color: var(--sgreen); }
  .lede small { color: var(--nm); font-size: 13.5px; margin-top: 10px; display: block; }
  .nightmap { height: 430px; margin: 0 -16px; background: var(--nb); z-index: 0; border-top: 1px solid var(--nl); border-bottom: 1px solid var(--nl); }
  .nightmap .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.55) contrast(1.45) sepia(.4) hue-rotate(180deg) saturate(1.6); }
  .nightmap .leaflet-control-attribution { background: rgba(13,20,34,.7); color: var(--nm); font-size: 10px; }
  .nightmap .leaflet-control-attribution a { color: var(--nm); }
  .nightmap path.lamp { filter: drop-shadow(0 0 3px rgba(255,181,71,.9)); }
  .nightmap path.asked { filter: drop-shadow(0 0 6px rgba(255,255,255,.6)); }
  .leaflet-tooltip.ringlabel, .leaflet-tooltip.placelabel { background: transparent; border: 0; box-shadow: none; padding: 0;
           font: 600 12px "Barlow", system-ui, sans-serif; text-shadow: 0 0 4px #0d1422, 0 0 2px #0d1422; }
  .leaflet-tooltip.ringlabel { color: var(--sgreen, #00a65a); }
  .leaflet-tooltip.placelabel { color: #fff; }
  .leaflet-tooltip.ringlabel::before, .leaflet-tooltip.placelabel::before { display: none; }
  .key { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--nm); font-size: 12.5px; margin-top: 10px; align-items: center; }
  .key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .key .lampk { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .key .askk { background: var(--amber); width: 12px; height: 12px; border: 2px solid #fff; }
  .key .ringk { width: 16px; height: 0; border-top: 2.5px solid var(--sgreen); border-radius: 0; }
  .key .placek { background: #fff; }
  .river { width: 100%; height: auto; display: block; overflow: visible; }
  .river text { font: 500 12.5px "Barlow", system-ui, sans-serif; fill: var(--ni); }
  .river .sub { fill: var(--nm); font-size: 11.5px; }
  .river .band { opacity: .55; transition: opacity .15s; }
  .river .band.hot { opacity: .95; }
  .clock { width: 100%; height: auto; display: block; }
  .clock text { font: 500 11px "Barlow", system-ui, sans-serif; fill: var(--nm); }
  .clock .cellbg { fill: #172136; }
  .clock .cell.hot .cellbg { fill: #22304b; }
  .clock .dot { fill: var(--amber); }
  .firms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--nl); border: 1px solid var(--nl); border-radius: 10px; overflow: hidden; }
  .firm { background: var(--nb); padding: 12px 12px 11px; display: grid; gap: 6px; min-width: 0; }
  .firm.hot { background: #121b2b; }
  .firm:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .firm h5 { margin: 0; font: 600 15px "Barlow", system-ui, sans-serif; color: var(--ni); }
  .firm .num { font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .firm .num small { font: 500 13px "Barlow", system-ui, sans-serif; color: var(--nm); margin-left: 4px; }
  .firm dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
  .firm dt { color: var(--nm); }
  .firm dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .firm .stars { color: var(--amber); letter-spacing: 1px; }
  .firm .best { color: var(--sgreen); }
  .plot { width: 100%; height: auto; display: block; overflow: visible; }
  .plot .grid { stroke: var(--nl); stroke-width: 1; }
  .plot .axis { stroke: var(--slate); stroke-width: 1; }
  .plot .ref { stroke: var(--slate); stroke-width: 1; stroke-dasharray: 3 4; }
  .plot .tick { fill: var(--nm); font: 11px "Barlow", system-ui, sans-serif; }
  .plot .val { fill: var(--ni); font: 600 11.5px "Barlow", system-ui, sans-serif; }
  .plot .pt.hot circle:last-child { stroke: #fff; stroke-width: 2.5; }
  .plot .col.hot path, .plot .col.hot rect:not(:first-child) { opacity: .8; }
  .stats .statfoot { color: var(--nm); font-size: 12.5px; line-height: 1.45; border-top: 1px solid var(--nl); padding-top: 12px; }
  .tip { position: fixed; z-index: 50; display: none; max-width: 260px; background: #e9edf4; color: #0d1422; border-radius: 8px;
         padding: 7px 10px; font: 13px/1.35 "Barlow", system-ui, sans-serif; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .tip b { display: block; font: 600 15px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; }
  .tip span { display: block; color: #3a4660; }
  .stats [tabindex]:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  /* Mails zur Wohnung (verschlüsselt gespeichert, Text erst nach Antippen) */
  .mail { border-bottom: 1px solid var(--line); }
  .mail > button { width: 100%; text-align: left; background: none; padding: 9px 0; display: flex; gap: 8px;
                   align-items: baseline; font-size: 15px; }
  .mail .kind { font-weight: 650; }
  .mail .kind.absage { color: var(--muted); }
  .mail .kind.einladung, .mail .kind.selbstauskunft { color: var(--star); }
  .mail .meta { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  .mail .open { white-space: pre-line; overflow-wrap: anywhere; font-size: 14px; background: var(--chip);
                border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; }
  .mail .open b { display: block; margin-bottom: 6px; }
  .leaflet-tooltip { font: 600 12px system-ui, sans-serif; padding: 2px 6px; }
  .link { flex: 1; text-align: center; padding: 11px 12px; border-radius: 10px; background: var(--ink);
          color: var(--bg); font-weight: 600; text-decoration: none; font-size: 15px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Wohnungen <span id="count"></span></h1>
    <button id="run">Bot starten</button>
  </div>
  <div id="status">lädt …</div>
  <div id="runs"></div>
  <div class="bar tabs">
    <button class="seg" data-view="offers">Angebote</button>
    <button class="seg" data-view="mine">Meine Anfragen</button>
    <button class="seg" data-view="stats">Statistik</button>
  </div>
  <div class="bar" id="filters">
    <button class="seg" data-min="0">Alle</button>
    <button class="seg" data-min="3">★3+</button>
    <button class="seg" data-min="4">★4+</button>
    <span class="gap"></span>
    <button class="seg" data-sort="best">Beste</button>
    <button class="seg" data-sort="new">Neueste</button>
  </div>
</header>
<main id="list"></main>
<dialog id="detail"></dialog>
<dialog id="viewer" class="viewer"></dialog>
<dialog id="token">
  <h2>Bot von hier starten</h2>
  <p>Dafür braucht die App einmalig einen GitHub-Schlüssel (Token), der nur diesen Bot starten darf.
     Er bleibt auf diesem Gerät gespeichert.</p>
  <p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Token bei GitHub erstellen</a>:
     nur das Repository „Wohnungs-such-Bot“, Berechtigung „Actions: Read and write“.</p>
  <input id="token-input" type="password" autocomplete="off" placeholder="github_pat_…">
  <p id="token-msg"></p>
  <div class="row">
    <button id="token-cancel">Abbrechen</button>
    <button id="token-save" class="ok">Speichern und starten</button>
  </div>
</dialog>

<script>
"use strict";
const HOUR = 3600e3;
const LATE_AFTER = 2 * HOUR;          // rötlich: so lange online und keine Anfrage
const STALE_AFTER = 45 * 60e3;        // Warnung: Bot hat so lange nichts aktualisiert
const DISPATCH = "https://api.github.com/repos/joshuaperlbach-dot/Wohnungs-such-Bot/actions/workflows/wbm.yml/dispatches";
let offers = {}, updated = null, lastAuto = null, lastManual = null, startedAt = 0;
let minStars = 0, openKey = null;
// Tab: alle Angebote oder nur die eigenen Anfragen (merkt sich das Gerät)
let view = (() => { try { const v = localStorage.getItem("view"); return v === "mine" || v === "stats" ? v : "offers"; } catch (e) { return "offers"; } })();
// Sortierung merkt sich das Gerät
let newestFirst = (() => { try { return localStorage.getItem("sort") === "new"; } catch (e) { return false; } })();

// Eigene Markierungen ("von Hand angefragt") bleiben nur auf diesem Gerät gespeichert.
function loadMarks() {
  try { return JSON.parse(localStorage.getItem("marks") || "{}"); } catch (e) { return {}; }
}
function saveMarks(m) {
  try { localStorage.setItem("marks", JSON.stringify(m)); } catch (e) { /* privater Modus */ }
}
let marks = loadMarks();
// "Nicht weiter verfolgen" (z.B. nach der Besichtigung): nur auf diesem Gerät
let dropped = (() => { try { return JSON.parse(localStorage.getItem("dropped") || "{}"); } catch (e) { return {}; } })();
function toggleDropped(key) {
  if (dropped[key]) delete dropped[key]; else dropped[key] = new Date().toISOString();
  try { localStorage.setItem("dropped", JSON.stringify(dropped)); } catch (e) {}
  render();
}
// Angebote, deren Anfrage-Seite von hier geöffnet wurde (danach fragt der Knopf, ob es geklappt hat)
let opened = (() => { try { return JSON.parse(localStorage.getItem("opened") || "{}"); } catch (e) { return {}; } })();
function saveOpened() { try { localStorage.setItem("opened", JSON.stringify(opened)); } catch (e) {} }
// Link springt, wo möglich, direkt zum Anfrage-Formular der Gesellschaft (wie in der Push-Meldung)
const FORM_ANCHOR = { degewo: "#accordion-nl-rent-details" };
const formUrl = o => { const u = safeUrl(o.url); return u && !u.includes("#") ? u + (FORM_ANCHOR[o.company] || "") : u; };

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;

    "Wie viele passende Angebote jede Gesellschaft hatte, wie gut und wie teuer sie im Schnitt waren und wie deine Anfragen dort liefen.");
  const firms = el("div", "firms");
  for (const c of cs) {
    const f = el("div", "firm");
    const n = el("div", "num"); n.append(document.createTextNode(String(c.a.length)), el("small", null, c.a.length === 1 ? "Angebot" : "Angebote"));
    const dl = el("dl");
    const row = (t, v, cls) => { dl.append(el("dt", null, t)); const d = el("dd", cls, v); dl.append(d); };
    row("Sterne", c.stars != null ? `${"★".repeat(Math.round(c.stars))} ${c.stars.toFixed(1).replace(".", ",")}` : "–", "stars");
    row("pro m²", c.qm != null ? `${num(c.qm, 1)} €` : "–");
    row("Anfragen", c.asked ? `${c.weiter} von ${c.asked} weiter` : "keine", c.weiter ? "best" : "");
    f.append(el("h5", null, c.name), n, dl);
    hover(f, () => [c.name, `${c.a.length} passende Angebote`, c.asked ? `${c.asked} angefragt, ${c.weiter} eine Runde weiter` : "noch nie angefragt"]);
    firms.append(f);
  }
  fsec.append(firms);
  wrap.append(fsec);

  // ---------- Preis gegen Größe
  const pts = items.filter(it => it.price && it.size && it.size < 120 && it.price < 1400);
  const qmAll = avg(pts.map(it => it.price / it.size));
  const sc = block(`Im Schnitt zahlst du ${num(qmAll, 1)} € warm pro m²`,
    "Jede Wohnung ein Punkt: rechts größer, oben teurer. Gestrichelt: 12, 15 und 18 € pro m². Weiß umrandet: angefragt.");
  sc.append(scatter(pts, isAsked));
  wrap.append(sc);

  // ---------- Wochen
  const weeks = new Map();
  const wkKey = d => { const t = new Date(d); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - (t.getDay() + 6) % 7); return t.getTime(); };
  for (let t = wkKey(first); t <= Date.now(); t += 7 * 864e5) weeks.set(wkKey(t), [0, 0]);
  for (const it of items) { const d = new Date(it.online_since); if (!isFinite(d)) continue; const w = weeks.get(wkKey(d)); if (w) w[isAsked(it) ? 1 : 0]++; }
  const wv = [...weeks.entries()];
  const wsec = block(`Jede Woche etwa ${Math.round(avg(wv.slice(0, -1).map(([, v]) => v[0] + v[1])) || 0)} passende Angebote`,
    "Höhe = passende Angebote der Woche, grüner Teil = angefragt. Die letzte Säule ist die laufende Woche.");
  wsec.append(weekBars(wv));
  wrap.append(wsec);

  wrap.append(el("p", "statfoot", "„Passend“ heißt: hat die Filter des Bots bestanden (Größe, Preis, Bezirk, kein WBS). Von Hand markierte Anfragen zählen nur auf diesem Gerät mit."));
}

function ringInside(c) {   // Punkt im Polygon des S-Bahn-Rings (wie rating.py, ohne Toleranz)
  let inside = false;
  for (let i = 0, j = RING.length - 1; i < RING.length; j = i++) {
    const [yi, xi] = RING[i], [yj, xj] = RING[j];
    if ((yi > c[0]) !== (yj > c[0]) && c[1] < xi + (c[0] - yi) * (xj - xi) / (yj - yi)) inside = !inside;
  }
  return inside;
}

function river(asked, outcome) {   // Sankey: Gesellschaft -> Ergebnis
  const W = 360, unit = Math.max(6, Math.min(12, 300 / Math.max(1, asked.length))), gap = 10, lx = 92, rx = W - 112, nw = 8;
  const left = {}, right = {}, link = {};
  for (const it of asked) {
    const c = COMPANY[it.company] || it.company || "?", o = outcome(it);
    left[c] = (left[c] || 0) + 1; right[o] = (right[o] || 0) + 1;
    link[c + "|" + o] = (link[c + "|" + o] || 0) + 1;
  }
  const L = Object.entries(left).sort((a, b) => b[1] - a[1]);
  const R = Object.keys(OUTCOME).filter(o => right[o]).map(o => [o, right[o]]);
  const hL = L.reduce((s, [, v]) => s + v * unit, 0) + gap * (L.length - 1);
  const hR = R.reduce((s, [, v]) => s + v * unit, 0) + gap * (R.length - 1);
  const H = Math.max(hL, hR) + 8;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "river", role: "img", "aria-label": "Was aus den Anfragen wurde" });
  const place = (arr, h) => { let y = (H - h) / 2; const pos = {}; for (const [n, v] of arr) { pos[n] = { y, h: v * unit, off: 0 }; y += v * unit + gap; } return pos; };
  const pl = place(L, hL), pr = place(R, hR);
  for (const [o] of R) for (const [c] of L) {   // Bänder, sortiert nach Ergebnis, damit sie sich wenig kreuzen
    const v = link[c + "|" + o]; if (!v) continue;
    const a = pl[c], b = pr[o], h = v * unit, y0 = a.y + a.off, y1 = b.y + b.off;
    a.off += h; b.off += h;
    const x0 = lx + nw, x1 = rx, mx = (x0 + x1) / 2;
    const band = svgEl("path", { d: `M${x0},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1} V${y1 + h} C${mx},${y1 + h} ${mx},${y0 + h} ${x0},${y0 + h} Z`,
      fill: OUTCOME[o].color, class: "band" }, svg);
    hover(band, () => [`${v} Anfrage${v === 1 ? "" : "n"}`, `${c} → ${OUTCOME[o].name}`]);
  }
  for (const [c, v] of L) {
    const p = pl[c];
    svgEl("rect", { x: lx, y: p.y, width: nw, height: p.h, rx: 2, fill: "var(--ni)" }, svg);
    const t = svgEl("text", { x: lx - 8, y: p.y + p.h / 2 + 4, "text-anchor": "end" }, svg); t.textContent = c;
    const n = svgEl("text", { x: lx - 8, y: p.y + p.h / 2 + 17, "text-anchor": "end", class: "sub" }, svg);
    if (p.h > 14) n.textContent = `${v}`;
  }
  for (const [o, v] of R) {
    const p = pr[o];
    svgEl("rect", { x: rx, y: p.y, width: nw, height: p.h, rx: 2, fill: OUTCOME[o].color }, svg);
    const t = svgEl("text", { x: rx + nw + 8, y: p.y + p.h / 2 - 2 }, svg); t.textContent = OUTCOME[o].name;
    const n = svgEl("text", { x: rx + nw + 8, y: p.y + p.h / 2 + 12, class: "sub" }, svg); n.textContent = `${v} Anfrage${v === 1 ? "" : "n"}`;
  }
  return svg;
}

function dotClock(cells) {   // Wochentag x Stunde, jeder Punkt eine Wohnung (bis 9 Punkte je Feld, darüber heller)
  const W = 360, lw = 26, top = 16, cw = (W - lw) / 16, ch = 24;
  const H = top + 7 * ch;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "clock", role: "img", "aria-label": "Wann neue Angebote kommen" });
  for (let j = 0; j < 16; j += 2) { const t = svgEl("text", { x: lw + j * cw + 2, y: 11 }, svg); t.textContent = `${6 + j}`; }
  const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  cells.forEach((r, i) => {
    const ty = svgEl("text", { x: 0, y: top + i * ch + ch / 2 + 4 }, svg); ty.textContent = WD[i];
    r.forEach((v, j) => {
      const g = svgEl("g", { class: "cell" }, svg);
      const x = lw + j * cw, y = top + i * ch;
      svgEl("rect", { x: x + 1, y: y + 1, width: cw - 2, height: ch - 2, rx: 3, class: "cellbg" }, g);
      const n = Math.min(9, v), d = 4.2, pad = (cw - 3 * d - 4) / 2;
      for (let q = 0; q < n; q++) {
        svgEl("circle", { cx: x + pad + d / 2 + (q % 3) * (d + 2), cy: y + (ch - 3 * d - 4) / 2 + d / 2 + Math.floor(q / 3) * (d + 2), r: d / 2,
          class: "dot", opacity: v > 9 ? 1 : 0.9 }, g);
      }
      hover(g, () => [`${v} Wohnung${v === 1 ? "" : "en"}`, `${["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"][i]}, ${6 + j}–${7 + j} Uhr`]);
    });
  });
  return svg;
}

function scatter(pts, isAsked) {
  const W = 360, H = 250, ml = 38, mb = 22, mt = 8, mr = 8;
  const x0 = 25, x1 = Math.max(75, Math.ceil(Math.max(0, ...pts.map(p => p.size)) / 5) * 5);
  const y0 = 300, y1 = Math.max(1000, Math.ceil(Math.max(0, ...pts.map(p => p.price)) / 100) * 100);
  const X = v => ml + (W - ml - mr) * (v - x0) / (x1 - x0), Y = v => H - mb - (H - mb - mt) * (v - y0) / (y1 - y0);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "plot", role: "img", "aria-label": "Preis gegen Größe" });
  for (let v = 400; v <= y1; v += 200) {
    svgEl("line", { x1: ml, x2: W - mr, y1: Y(v), y2: Y(v), class: "grid" }, svg);
    svgEl("text", { x: ml - 5, y: Y(v) + 4, "text-anchor": "end", class: "tick" }, svg).textContent = `${v} €`;
  }
  for (let v = 30; v <= x1; v += 10) svgEl("text", { x: X(v), y: H - 5, "text-anchor": "middle", class: "tick" }, svg).textContent = `${v} m²`;
  svgEl("line", { x1: ml, x2: W - mr, y1: H - mb, y2: H - mb, class: "axis" }, svg);
  for (const q of [12, 15, 18]) {
    const xa = Math.max(x0, y0 / q), xb = Math.min(x1, y1 / q);
    if (xb <= xa) continue;
    svgEl("line", { x1: X(xa), y1: Y(q * xa), x2: X(xb), y2: Y(q * xb), class: "ref" }, svg);
    svgEl("text", { x: X(xb) - 2, y: Y(q * xb) + (xb === x1 ? -5 : 12), "text-anchor": "end", class: "tick" }, svg).textContent = `${q} €/m²`;
  }
  for (const p of [...pts].sort((a, b) => isAsked(a) - isAsked(b))) {
    const a = isAsked(p);
    const g = svgEl("g", { class: "pt" }, svg);
    svgEl("circle", { cx: X(p.size), cy: Y(p.price), r: 12, fill: "transparent" }, g);
    svgEl("circle", { cx: X(p.size), cy: Y(p.price), r: a ? 4.6 : 3.2, fill: "var(--amber)", "fill-opacity": a ? 1 : 0.7,
      stroke: a ? "#fff" : "none", "stroke-width": 1.6 }, g);
    hover(g, () => [`${num(p.price)} € warm, ${num(p.size)} m²`, `${p.bezirk || ""}, ${COMPANY[p.company] || p.company || ""}`,
      `${"★".repeat(p.stars || 0)} ${num(p.price / p.size, 1)} €/m²${a ? ", angefragt" : ""}`]);
  }
  return svg;
}

function weekBars(wv) {
  const W = 360, H = 160, wb = 20, wt = 16;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "plot", role: "img", "aria-label": "Angebote pro Woche" });
  const max = Math.max(1, ...wv.map(([, v]) => v[0] + v[1]));
  const step = W / Math.max(1, wv.length), bw = Math.min(30, step * 0.6);
  wv.forEach(([t, [rest, ak]], i) => {
    const x = i * step + (step - bw) / 2, hT = (H - wb - wt) * (rest + ak) / max, hA = (H - wb - wt) * ak / max;
    const g = svgEl("g", { class: "col" }, svg);
    svgEl("rect", { x: x - 3, y: wt - 6, width: bw + 6, height: H - wb - wt + 6, fill: "transparent" }, g);
    if (hT > 0) svgEl("path", { d: roundTop(x, H - wb, bw, hT), fill: "var(--amber)", "fill-opacity": 0.55 }, g);
    if (hA > 0) svgEl("rect", { x, y: H - wb - hA, width: bw, height: hA, fill: "var(--sgreen)" }, g);
    if (hA > 0 && hT - hA > 2) svgEl("line", { x1: x, x2: x + bw, y1: H - wb - hA, y2: H - wb - hA, stroke: "var(--nb)", "stroke-width": 2 }, g);
    svgEl("text", { x: x + bw / 2, y: H - wb - hT - 5, "text-anchor": "middle", class: "val" }, g).textContent = rest + ak;
    const d = new Date(t);
    if (wv.length <= 8 || i % 2 === 0) svgEl("text", { x: x + bw / 2, y: H - 5, "text-anchor": "middle", class: "tick" }, svg).textContent = `${d.getDate()}.${d.getMonth() + 1}.`;
    hover(g, () => [`${rest + ak} passende Angebote`, `Woche ab ${d.toLocaleDateString("de-DE")}`, `${ak} angefragt`]);
  });
  svgEl("line", { x1: 0, x2: W, y1: H - wb, y2: H - wb, class: "axis" }, svg);
  return svg;
}
function roundTop(x, base, w, h) {
  const r = Math.min(4, h, w / 2), y = base - h;
  return `M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${base} Z`;
}

function makeCard(key, o) {
    const card = el("article", "card");
    const tap = el("button", "tap");
    const imgs = (o.images || []).map(imgUrl).filter(Boolean);
    const pics = el("div", "pics");
    const strip = el("div", "strip" + (imgs.length === 1 ? " one" : ""));
    for (const src of imgs) {
      const i = el("img");
      i.loading = "lazy"; i.alt = ""; i.referrerPolicy = "no-referrer"; i.src = src;
      i.addEventListener("error", () => i.remove());
      i.addEventListener("click", ev => { ev.stopPropagation(); viewFrom(strip, i); });
      strip.append(i);
    }
    if (!imgs.length) strip.append(el("span", "none", "kein Bild"));
    strip.addEventListener("click", () => openDetail(key));
    pics.append(strip);
    if (imgs.length > 1) pics.append(el("span", "count", `${imgs.length} Bilder`));
    const info = el("div", "info");
    const stars = el("div", "stars", "★".repeat(o.stars || 0) + "☆".repeat(5 - (o.stars || 0)));
    if (o.points != null) stars.append(el("small", null, `${o.points} Punkte`));
    const v = viewing(o);
    if (v) stars.append(el("span", "badge " + v.cls, v.text));
    if ((o.plans || []).length) stars.append(el("span", "badge plan", "Grundriss"));
    info.append(stars,
      el("div", "main-line", `${rooms(o.rooms)} Zi · ${num(o.size)} m² · ${num(o.price)} € warm`),
      place(o),
      o.gone ? el("div", "sub gone", `${COMPANY[o.company] || o.company || ""} · nicht mehr online`)
             : el("div", "sub", `${COMPANY[o.company] || o.company || ""} · online ${ago(o.online_since).replace("vor ", "seit ")}`));
    tap.append(info);
    tap.addEventListener("click", () => openDetail(key));
    card.append(pics, tap, reqButton(key, o));
    return card;
}

      i.loading = "lazy"; i.alt = "Grundriss"; i.referrerPolicy = "no-referrer"; i.src = src;
      i.addEventListener("error", () => i.remove());
      i.addEventListener("click", () => viewFrom(box, i));

    }

  }

  body.append(el("h3", null, "Eckdaten"));
  const t = el("table");
  row(t, "Zimmer", rooms(o.rooms));
  row(t, "Wohnfläche", o.size != null ? `${num(o.size, 1)} m²` : null);
  row(t, "Warmmiete", o.price != null ? `${num(o.price, 2)} €` : null);
  row(t, "Kaltmiete", o.cold != null ? `${num(o.cold, 2)} €` : null);
  row(t, "Etage", o.floor == null ? null : (o.floor === 0 ? "EG" : `${o.floor}.`) + (o.levels ? ` von ${o.levels}` : ""));
  row(t, "Baujahr", o.year != null ? String(o.year) : null);
  row(t, "Gesellschaft", COMPANY[o.company] || o.company);
  row(t, "Online seit", o.online_since ? new Date(o.online_since).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : null);
  if (o.requested_at) row(t, "Anfrage raus", new Date(o.requested_at).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }));
  body.append(t);

  if ((o.mails || []).length) {
    body.append(el("h3", null, "Mails dazu"));
    for (const m of [...o.mails].reverse()) body.append(mailRow(m));
  }

  body.append(el("h3", null, "Lage"));
  const mapBox = el("div"), dist = el("div", "dist");
  mapBox.id = "map";
  const edit = el("button", "places-btn", "Eigene Orte ändern");
  edit.addEventListener("click", editPlaces);
  body.append(mapBox, dist, edit);
  if (isMine(openKey, o)) {
    const drop = el("button", "places-btn", dropped[openKey] ? "Doch wieder verfolgen" : "Nicht weiter verfolgen");
    drop.style.marginLeft = "8px";
    drop.addEventListener("click", () => toggleDropped(openKey));
    body.append(drop);
  }
  requestAnimationFrame(() => showMap(o, mapBox, dist));

  if (o.parts && Object.keys(o.parts).length) {
    body.append(el("h3", null, "So kommen die Sterne zustande"));
    for (const [name, [got, max]] of Object.entries(o.parts).sort((a, b) => b[1][1] - a[1][1])) {
      const p = el("div", "part");
      const track = el("div", "track"), fill = el("div", "fill");
      fill.style.width = `${max ? Math.round(100 * got / max) : 0}%`;
      track.append(fill);
      p.append(el("span", null, name), track, el("span", null, `${num(got)} / ${max}`));
      body.append(p);
    }
  }
  if (o.text) body.append(el("h3", null, "Beschreibung"), el("div", "text", o.text));

  const foot = el("div", "foot"), inner = el("div", "in");
  const url = safeUrl(o.url);
  if (o.gone) {
    inner.append(el("span", "link off", "Nicht mehr online"));
  } else if (url && !state(openKey, o).url) {  // sonst öffnet schon der Anfrage-Knopf die Seite
    const a = el("a", "link", "Zur Anzeige");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    inner.append(a);
  }
  inner.append(reqButton(openKey, o));
  foot.append(inner);
  sheet.append(close, gallery, body, foot);
  dlg.replaceChildren(sheet);
}

// ---- Mails: der Bot legt sie verschlüsselt ab (die Seite ist öffentlich). Den Schlüssel kennt nur dieses
// Gerät (einmal eingeben oder per Link #mailkey=...); er passt zum GitHub-Secret MAIL_VIEW_KEY.
const MAIL_KIND = { selbstauskunft: "Selbstauskunft nötig", absage: "Absage", einladung: "Einladung", eingang: "Eingangsbestätigung",
                    formular: "Formular nötig", antwort: "Antwort" };
const openMails = new Set(), mailCache = new Map();
let mailKeyPromise = null;
const getMailPass = () => { try { return localStorage.getItem("mailkey") || ""; } catch (e) { return ""; } };
function setMailPass(v) { mailKeyPromise = null; try { v ? localStorage.setItem("mailkey", v) : localStorage.removeItem("mailkey"); } catch (e) {} }
function mailKey(pass) {
  if (!mailKeyPromise) mailKeyPromise = crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
    .then(base => crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: new TextEncoder().encode("wohnungsbot-mails-v1"), iterations: 200000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]));
  return mailKeyPromise;
}
async function unseal(box) {
  if (mailCache.has(box)) return mailCache.get(box);
  const raw = Uint8Array.from(atob(box), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, await mailKey(getMailPass()), raw.slice(12));
  const v = JSON.parse(new TextDecoder().decode(plain));
  mailCache.set(box, v);
  return v;
}
function mailRow(m) {
  const wrap = el("div", "mail"), head = el("button");
  const when = m.at ? new Date(m.at).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "";
  head.append(el("span", "kind " + (m.kind || ""), MAIL_KIND[m.kind] || "Mail"), el("span", "meta", `${m.from || ""} · ${when}`));
  const box = el("div", "open");
  const show = async () => {
    if (!getMailPass()) {
      const k = prompt("Schlüssel für die Mails (einmal auf diesem Gerät eingeben):");
      if (!k) return;
      setMailPass(k.trim());
    }
    try {
      const v = await unseal(m.box);
      box.replaceChildren(el("b", null, v.subject || ""), document.createTextNode(v.text || ""));
    } catch (e) {
      setMailPass("");
      box.replaceChildren(document.createTextNode("Der Schlüssel passt nicht. Nochmal antippen und neu eingeben."));
    }
    if (!box.isConnected) wrap.append(box);
  };
  head.addEventListener("click", () => {
    if (openMails.has(m.id)) { openMails.delete(m.id); box.remove(); }
    else { openMails.add(m.id); show(); }
  });
  wrap.append(head);
  if (openMails.has(m.id)) show();
  return wrap;
}

// ---- Fotos in voller Größe: antippen, dann wischen
function viewFrom(container, img) {
  const srcs = [...container.querySelectorAll("img")].map(x => x.src);
  openViewer(srcs, Math.max(0, srcs.indexOf(img.src)));
}
function openViewer(srcs, start) {
  const dlg = document.getElementById("viewer");
  const frames = el("div", "frames"), pos = el("div", "pos");
  for (const src of srcs) {
    const i = el("img");
    i.alt = ""; i.referrerPolicy = "no-referrer"; i.src = src;
    frames.append(i);
  }
  const close = el("button", "close", "✕");
  close.setAttribute("aria-label", "Schließen");
  close.addEventListener("click", () => dlg.close());
  const update = () => { pos.textContent = `${Math.round(frames.scrollLeft / (frames.clientWidth || 1)) + 1} / ${srcs.length}`; };
  frames.addEventListener("scroll", update, { passive: true });
  dlg.replaceChildren(frames, close, pos);
  if (!dlg.open) { dlg.showModal(); history.pushState({ layer: "viewer" }, ""); }
  frames.scrollLeft = start * frames.clientWidth;
  update();
}

// ---- Karte: Wohnung und eigene Orte. Die eigenen Orte (z.B. Zuhause) stehen nur auf diesem Gerät,
// nie in der öffentlichen Seite. Einrichten über "Eigene Orte ändern" oder einen Link mit #orte=...
const LEAFLET = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
const DEFAULT_PLACES = [{ name: "Arbeit neu", q: "Engelbecken, Berlin", lat: 52.5049, lon: 13.4163, color: "#2f6fde" }];
const PLACE_COLORS = ["#2f6fde", "#7a4cc2", "#1f8f4e", "#c46a00"];
let leafletLoad = null;
function leaflet() {
  if (!leafletLoad) leafletLoad = new Promise(resolve => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = LEAFLET + "leaflet.css";
    document.head.append(css);
    const js = document.createElement("script");
    js.src = LEAFLET + "leaflet.js";
    js.onload = () => resolve(window.L || null);
    js.onerror = () => { leafletLoad = null; resolve(null); };
    document.head.append(js);
  });
  return leafletLoad;
}
let lastLookup = 0;
async function geocode(q) {
  const key = "geo:" + q;
  try { const c = localStorage.getItem(key); if (c) return JSON.parse(c); } catch (e) {}
  const wait = lastLookup + 1100 - Date.now();   // Nominatim: höchstens eine Anfrage pro Sekunde
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastLookup = Date.now();
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=" + encodeURIComponent(q));
    const d = await r.json();
    const v = d && d[0] ? [+d[0].lat, +d[0].lon] : null;
    if (v) try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
    return v;
  } catch (e) { return null; }
}
async function offerCoord(o) {
  if (Array.isArray(o.coord) && o.coord.length === 2 && o.coord.every(isFinite)) return o.coord.map(Number);
  return o.address ? geocode(o.address) : null;
}
function places() {
  try { const p = JSON.parse(localStorage.getItem("places") || "null"); if (Array.isArray(p)) return p; } catch (e) {}
  return DEFAULT_PLACES;
}
async function setPlaces(text) {   // "Zuhause: Straße 1, 10437; Arbeit: ..."
  const out = [];
  for (const part of text.split(";").map(x => x.trim()).filter(Boolean)) {
    const m = part.match(/^([^:]{1,30}):\s*(.+)$/);
    const name = (m ? m[1] : part).trim(), q = (m ? m[2] : part).trim();
    const c = await geocode(/berlin/i.test(q) ? q : q + ", Berlin");
    if (c) out.push({ name, q, lat: c[0], lon: c[1], color: PLACE_COLORS[out.length % PLACE_COLORS.length] });
  }
  try { localStorage.setItem("places", JSON.stringify(out)); } catch (e) {}
  return out;
}
async function editPlaces() {
  const now = places().map(p => `${p.name}: ${p.q || ""}`).join("; ");
  const t = prompt("Eigene Orte für die Karte (Name: Adresse), getrennt mit Semikolon:", now);
  if (t === null) return;
  await setPlaces(t);
  if (openKey) drawDetail();
}
function km(a, b) {
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
async function showMap(o, box, dist) {
  const where = await offerCoord(o);
  if (!box.isConnected) return;
  if (!where) { box.style.height = "auto"; box.replaceChildren(el("div", "dist", "Adresse nicht auf der Karte gefunden.")); return; }
  const L = await leaflet();
  if (!box.isConnected) return;
  if (!L) { box.style.height = "auto"; box.replaceChildren(el("div", "dist", "Karte konnte nicht geladen werden.")); return; }
  const map = L.map(box, { scrollWheelZoom: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
              { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  const label = (m, text) => m.bindTooltip(text, { permanent: true, direction: "top", offset: [0, -8] });
  label(L.circleMarker(where, { radius: 10, color: "#fff", weight: 3, fillColor: "#d93a2b", fillOpacity: 1 }).addTo(map), "Wohnung");
  const pts = [where], parts = [];
  for (const p of places()) {
    const at = [p.lat, p.lon];
    label(L.circleMarker(at, { radius: 7, color: "#fff", weight: 2, fillColor: p.color || "#2f6fde", fillOpacity: 1 }).addTo(map), p.name);
    pts.push(at);
    parts.push(`${p.name} ${km(where, at).toLocaleString("de-DE", { maximumFractionDigits: 1 })} km`);
  }
  map.fitBounds(pts, { padding: [36, 36], maxZoom: 15 });
  dist.textContent = parts.length ? "Luftlinie: " + parts.join(" · ") : "";
}

function openDetail(key) {
  openKey = key;
  drawDetail();
  const dlg = document.getElementById("detail");
  if (!dlg.open) { dlg.showModal(); history.pushState({ layer: "detail" }, ""); }
  dlg.scrollTop = 0;
}
document.getElementById("detail").addEventListener("close", () => { openKey = null; });
// Zurück-Taste/-Geste des Handys schließt Bildbetrachter bzw. Anzeige statt die Seite zu verlassen:
// beim Öffnen gibt es einen Eintrag im Verlauf, "Zurück" nimmt ihn wieder weg.
window.addEventListener("popstate", () => {
  const layer = history.state && history.state.layer;
  const viewer = document.getElementById("viewer"), detail = document.getElementById("detail");
  if (layer !== "viewer" && viewer.open) viewer.close();
  if (!layer && detail.open) detail.close();
});
// Mit ✕ geschlossen: den eigenen Verlaufseintrag wieder entfernen
for (const [id, layer] of [["viewer", "viewer"], ["detail", "detail"]]) {
  document.getElementById(id).addEventListener("close", () => {
    if (history.state && history.state.layer === layer) history.back();
  });
}

async function refresh() {
  try {
    const r = await fetch("offers.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    offers = data.offers || {};
    updated = data.updated || null;
    lastAuto = data.last_auto || null;
    lastManual = data.last_manual || null;
    // Neue Daten nach dem Start von hier: Lauf ist durch
    if (startedAt && updated && new Date(updated).getTime() > startedAt) startedAt = 0;
  } catch (e) {
    document.getElementById("status").textContent = "Liste konnte nicht geladen werden.";
  }
  render();
}

}));

}));
// ---- Bot von der App aus starten (GitHub "workflow_dispatch")
function getToken() { try { return localStorage.getItem("gh_token") || ""; } catch (e) { return ""; } }
function setToken(t) { try { t ? localStorage.setItem("gh_token", t) : localStorage.removeItem("gh_token"); } catch (e) {} }
const tokenDlg = document.getElementById("token"), tokenMsg = document.getElementById("token-msg");

async function startBot() {
  const token = getToken();
  if (!token) { tokenMsg.textContent = ""; tokenDlg.showModal(); return; }
  const run = document.getElementById("run");
  run.disabled = true; run.textContent = "startet …";
  let res = null;
  try {
    res = await fetch(DISPATCH, {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28" },
      body: JSON.stringify({ ref: "main", inputs: { source: "app" } }),
    });
  } catch (e) { /* kein Netz */ }
  if (res && res.status === 204) {
    startedAt = Date.now();
    render();
    setTimeout(refresh, 100e3);
    setTimeout(refresh, 150e3);
    return;
  }
  render();
  if (res && [401, 403, 404].includes(res.status)) {
    setToken("");
    tokenMsg.textContent = `GitHub hat den Token abgelehnt (${res.status}). Bitte neu eingeben.`;
    tokenDlg.showModal();
  } else {
    document.getElementById("status").textContent = "Start hat nicht geklappt" + (res ? ` (${res.status})` : " (kein Netz)") + ".";
  }
}
document.getElementById("run").addEventListener("click", startBot);
document.getElementById("token-cancel").addEventListener("click", () => tokenDlg.close());
document.getElementById("token-save").addEventListener("click", () => {
  const t = document.getElementById("token-input").value.trim();
  if (!t) { tokenMsg.textContent = "Bitte den Token einfügen."; return; }
  setToken(t);
  document.getElementById("token-input").value = "";
  tokenDlg.close();
  startBot();
});

refresh();
setInterval(refresh, 120e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
