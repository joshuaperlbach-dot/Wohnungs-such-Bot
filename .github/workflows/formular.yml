name: Formular ansehen (einmalig)

on:
  workflow_dispatch:
    inputs:
      skript:
        description: "Werkzeug aus tools/"
        default: "tools/gewobag_ansehen.py"
      arg:
        description: "Zusatzangabe für das Werkzeug (optional)"
        default: ""

permissions:
  contents: write   # tools/drive_fotos.py legt Bilder ab

jobs:
  ansehen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright pymupdf && python -m playwright install --with-deps chromium
      - name: Seite ansehen (nur Aufbau, ohne persönliche Daten)
        env:
          SKRIPT: ${{ inputs.skript || 'tools/gewobag_ansehen.py' }}
          ARG: ${{ inputs.arg }}
          MAIL_USER: ${{ secrets.MAIL_USER }}            # nur für tools/mail_ids.py
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          case "$SKRIPT" in tools/*.py) python "$SKRIPT" ;; *) echo "nur tools/*.py"; exit 1 ;; esac
