name: WBM-Bot

on:
  schedule:
    - cron: "3-59/10 * * * *"   # etwa alle 10 Minuten (GitHub kann verzögern)
  workflow_dispatch:          # Anstoß von außen: der Wecker (cron-job.org) oder der Knopf in der App
    inputs:
      source:
        description: "Wer startet: wecker (automatisch) oder app (von Hand)"
        required: false
        default: wecker

permissions:
  contents: write             # damit seen.json gespeichert werden kann

concurrency:
  group: wbm-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # immer den neuesten Stand; sonst holt ein wartender Lauf einen veralteten
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bot ausführen
        timeout-minutes: 5
        env:
          WBM_SEND: ${{ vars.WBM_SEND }}               # 1 = wirklich senden, sonst Trockenlauf
          MAX_WARM_SEND: ${{ vars.MAX_WARM_SEND }}     # höchste Gesamtmiete für Anfragen; leer = keine Grenze
          WBM_PERSON_JSON: ${{ secrets.WBM_PERSON_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_SOURCE: ${{ inputs.source }}
        run: python wbm_bot.py
      - name: inberlinwohnen-Bot ausführen
        if: always()            # unabhängig vom WBM-Bot
        timeout-minutes: 4
        env:
          WBM_SEND: ${{ vars.WBM_SEND }}               # 1 = HOWOGE wirklich anfragen, sonst Trockenlauf
          MAX_WARM_SEND: ${{ vars.MAX_WARM_SEND }}      # höchste Gesamtmiete für Anfragen; leer = keine Grenze
          WBM_PERSON_JSON: ${{ secrets.WBM_PERSON_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_SOURCE: ${{ inputs.source }}
        run: python ibw_bot.py
      - name: Antworten per Mail auswerten
        if: always()
        continue-on-error: true   # hängt das Postfach, soll der Lauf trotzdem als gelungen gelten
        timeout-minutes: 2
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_SOURCE: ${{ inputs.source }}
        run: python mail_check.py
      - name: Seiten-Wächter (WGLi)
        if: always()
        timeout-minutes: 1
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py
      - name: Gesehene Angebote speichern
        if: always()            # auch nach Absturz/Timeout, sonst gehen Anfragen doppelt raus
        run: |
          git config user.name "wbm-bot"
          git config user.email "wbm-bot@users.noreply.github.com"
          for f in seen.json seen_ibw.json mail_seen.json watch.json stats.json docs/offers.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "seen aktualisiert"
          # Bei Überschneidung gewinnt der Stand dieses Laufs (er ist der neueste); bis zu 3 Versuche
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
